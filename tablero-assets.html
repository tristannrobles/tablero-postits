<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Postit Tristes</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #e6e9f0;
      --dot: #c3c8d6;
      --bar: #f7f8fb;
      --ink: #1d2130;
      --mute: #667;
      --line: #cfd4e0;
      --panel: #fbfbfd;
      --acc: #3b5bdb;
      --accink: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #171b27;
        --dot: #2a3042;
        --bar: #1f2433;
        --ink: #e8eaf2;
        --mute: #99a0b5;
        --line: #33394d;
        --panel: #1f2433;
        --acc: #8fa6ff;
        --accink: #10142a
      }
    }

    :root[data-theme="dark"] {
      --bg: #171b27;
      --dot: #2a3042;
      --bar: #1f2433;
      --ink: #e8eaf2;
      --mute: #99a0b5;
      --line: #33394d;
      --panel: #1f2433;
      --acc: #8fa6ff;
      --accink: #10142a
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 14px/1.4 "Bricolage Grotesque", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    header {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 9px 14px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      z-index: 25
    }

    h1 {
      font-size: 16px;
      font-weight: 800;
      margin: 0 4px 0 0;
      display: flex;
      align-items: center;
      gap: 6px
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    .btn {
      background: var(--acc);
      color: var(--accink);
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .btn:hover {
      filter: brightness(1.07)
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 99px;
      padding: 4px 11px;
      cursor: pointer;
      font-size: 13px
    }

    .chip.on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative
    }

    #scroll {
      flex: 1;
      overflow: hidden;
      position: relative;
      touch-action: none;
      cursor: default;
      user-select: none;
      background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
      background-size: 26px 26px
    }

    #scroll.space-ready {
      cursor: grab
    }

    #scroll.panning {
      cursor: grabbing
    }

    #board {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform
    }

    /* Carriles de Columnas y botón + para nueva columna */
    .col-lane {
      position: absolute;
      width: 236px;
      border-radius: 14px;
      background: rgba(120, 130, 160, .08);
      border: 2px dashed rgba(120, 130, 160, .24);
      pointer-events: none;
      transition: background .15s, border-color .15s;
      z-index: 1
    }

    .col-lane.active-col {
      background: rgba(59, 91, 219, .1);
      border-color: var(--acc)
    }

    .col-add-note {
      position: absolute;
      width: 220px;
      height: 38px;
      border-radius: 9px;
      border: 2px dashed var(--line);
      background: rgba(255, 255, 255, .25);
      color: var(--mute);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 4;
      transition: background .15s, color .15s, transform .1s, border-color .15s
    }

    .col-add-note:hover {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--ink);
      transform: translateY(-1px)
    }

    .add-col-btn {
      position: absolute;
      width: 58px;
      height: 78px;
      border-radius: 12px;
      border: 2.5px dashed var(--line);
      background: var(--bar);
      color: var(--ink);
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 4px 0 rgba(29, 33, 48, .12);
      transition: transform .14s cubic-bezier(.2, 1.4, .3, 1), background .15s, border-color .15s
    }

    .add-col-btn:hover {
      background: var(--acc);
      color: var(--accink);
      border-color: #1d2130;
      border-style: solid;
      transform: translateY(-2px) scale(1.05)
    }

    .drop-slot {
      position: absolute;
      width: 220px;
      height: 6px;
      border-radius: 99px;
      background: var(--acc);
      box-shadow: 0 0 0 3px rgba(59, 91, 219, .22);
      pointer-events: none;
      display: none;
      z-index: 40
    }

    /* Caja de selección múltiple */
    #marquee {
      position: absolute;
      border: 1.5px solid var(--acc);
      background: rgba(59, 91, 219, .14);
      border-radius: 4px;
      pointer-events: none;
      display: none;
      z-index: 30
    }

    /* Cursores en vivo */
    .peer-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 40;
      transition: transform .07s linear;
      left: 0;
      top: 0
    }

    .peer-cursor svg {
      width: 18px;
      height: 18px;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35))
    }

    .peer-tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      margin-left: 10px;
      margin-top: -4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25)
    }

    /* Notas (Post-its) con estética vectorial / Nintendo */
    .note {
      position: absolute;
      width: 220px;
      min-height: 132px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 2.5px solid #1d2130;
      color: #1b1b22;
      box-shadow: 0 5px 0 rgba(29, 33, 48, .22);
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: box-shadow .16s cubic-bezier(.2, 1.3, .3, 1), transform .16s cubic-bezier(.2, 1.3, .3, 1);
      display: flex;
      flex-direction: column;
      gap: 5px;
      transform-origin: 50% 35%
    }

    .note:hover {
      box-shadow: 0 7px 0 rgba(29, 33, 48, .26);
      transform: translateY(-2px)
    }

    .note.sel {
      outline: 3px solid var(--acc);
      outline-offset: 2px;
      z-index: 10
    }

    .note.grabbed {
      z-index: 45 !important;
      box-shadow: -4px 16px 0 rgba(23, 27, 39, .28) !important;
      transform: translateY(-6px) scale(1.075) rotate(var(--tilt, 0deg)) !important;
      transition: box-shadow .14s cubic-bezier(.2, 1.4, .3, 1), transform .06s linear
    }

    .note.wobble-start {
      animation: grabWobble .32s cubic-bezier(.2, 1.5, .4, 1)
    }

    .note.landed {
      animation: landBounce .28s cubic-bezier(.25, 1.5, .5, 1)
    }

    @keyframes grabWobble {
      0% { transform: scale(1) rotate(0deg) }
      35% { transform: translateY(-7px) scale(1.1) rotate(-4.5deg) }
      70% { transform: translateY(-6px) scale(1.06) rotate(3deg) }
      100% { transform: translateY(-6px) scale(1.075) rotate(var(--tilt, 0deg)) }
    }

    @keyframes landBounce {
      0% { transform: translateY(-4px) scale(1.06) }
      45% { transform: translateY(2px) scale(1.05, 0.93) }
      75% { transform: translateY(-1px) scale(0.98, 1.02) }
      100% { transform: translateY(0) scale(1) }
    }

    /* Polvito vectorial estilo Nintendo al soltar la nota */
    .dust-puff {
      position: absolute;
      pointer-events: none;
      z-index: 8;
      background: #fffdf7;
      border: 2.5px solid #1d2130;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: dustBurst .42s cubic-bezier(.15, .85, .3, 1) forwards
    }

    @keyframes dustBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(.35)
      }
      55% {
        opacity: 1;
        transform: translate(calc(-50% + var(--dx) * .75), calc(-50% + var(--dy) * .75)) scale(1.1)
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15)
      }
    }

    .q-dup {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--acc);
      color: var(--accink);
      border: 2px solid var(--panel);
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
      z-index: 15;
      padding: 0;
      transition: transform .12s
    }

    .q-dup:hover {
      transform: translateX(-50%) scale(1.15)
    }

    .q-dup.top {
      top: -14px
    }

    .q-dup.bot {
      bottom: -14px
    }

    .note.sel .q-dup {
      display: flex
    }

    .note b {
      display: block;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.22;
      overflow-wrap: anywhere
    }

    .note.is-title {
      min-height: 78px;
      padding: 16px 16px;
      justify-content: center;
      align-items: center;
      text-align: center
    }

    .note.is-title b {
      font-size: 21px;
      line-height: 1.18;
      margin: 0
    }

    .note-body {
      font-size: 12.5px;
      line-height: 1.35;
      opacity: .85;
      white-space: pre-wrap;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
      margin: 1px 0
    }

    .note-checks {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 2px 0
    }

    .chk-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 12px;
      line-height: 1.25;
      cursor: pointer;
      padding: 2px 3px;
      border-radius: 4px
    }

    .chk-row:hover {
      background: rgba(0, 0, 0, .06)
    }

    .chk-row input {
      width: 14px;
      height: 14px;
      margin: 1px 0 0;
      cursor: pointer;
      accent-color: #1b1b22;
      flex-shrink: 0
    }

    .chk-row.done span {
      text-decoration: line-through;
      opacity: .6
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
      padding-top: 4px;
      align-items: center
    }

    .tag {
      display: inline-block;
      background: rgba(0, 0, 0, .12);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600
    }

    .drive-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, .78);
      color: #1b1b22;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 3px;
      width: fit-content;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
      transition: background .15s, transform .1s
    }

    .drive-btn:hover {
      background: #fff;
      transform: translateY(-1px)
    }

    .drive-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      margin-top: 3px;
      padding-top: 5px;
      border-top: 1px solid rgba(0, 0, 0, .08);
      opacity: .85;
      font-weight: 600
    }

    /* Panel lateral izquierdo fijo de Subgrupos */
    #sub-drawer {
      width: 235px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 13px;
      z-index: 22;
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .sub-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 14px
    }

    .sub-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: auto;
      flex: 1
    }

    .sub-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border-radius: 8px;
      cursor: grab;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: transform .12s, opacity .12s
    }

    .sub-item:active {
      cursor: grabbing
    }

    .sub-item.dragging {
      opacity: .4
    }

    .sub-item.drop-above {
      border-top: 2px solid var(--acc)
    }

    .sub-item.drop-below {
      border-bottom: 2px solid var(--acc)
    }

    .sub-grip {
      opacity: .4;
      font-size: 12px;
      cursor: grab;
      user-select: none;
      letter-spacing: -1px
    }

    .sub-item:hover .sub-grip {
      opacity: .8
    }

    .sub-item:hover {
      background: var(--bg)
    }

    .sub-item.active {
      background: var(--acc);
      color: var(--accink)
    }

    .sub-item .sub-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .sub-item .sub-act {
      opacity: 0;
      background: transparent;
      border: 0;
      padding: 2px 5px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      color: inherit
    }

    .sub-item:hover .sub-act {
      opacity: .8
    }

    .sub-item .sub-act:hover {
      opacity: 1;
      background: rgba(0, 0, 0, .15)
    }

    /* Panel lateral derecho */
    aside {
      width: 325px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 14px;
      overflow: auto;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 22
    }

    aside.open {
      display: flex
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      color: var(--mute)
    }

    input,
    select,
    textarea {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 9px;
      color: var(--ink);
      width: 100%
    }

    textarea {
      min-height: 72px;
      resize: vertical
    }

    .sw {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .sw button {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer
    }

    .sw button.on {
      border-color: var(--ink)
    }

    .cat-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .cat-dot-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--line);
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15)
    }

    .cat-pop {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
      z-index: 35;
      display: none
    }

    .cat-pop.open {
      display: block
    }

    .cat-dd {
      position: absolute;
      top: 100%;
      left: 34px;
      right: 0;
      margin-top: 5px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
      z-index: 36;
      display: none;
      max-height: 170px;
      overflow-y: auto;
      flex-direction: column;
      gap: 2px
    }

    .cat-dd.open {
      display: flex
    }

    .cat-dd-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      width: 100%
    }

    .cat-dd-item:hover {
      background: var(--bg)
    }

    .cat-dd-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 0, 0, .25);
      flex-shrink: 0
    }

    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      border: 1px solid rgba(0, 0, 0, .15)
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .row>* {
      flex: 1
    }

    .ghost {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 11px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      color: var(--ink);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px
    }

    .ghost:hover {
      background: var(--bg)
    }

    .danger {
      color: #d6336c
    }

    :focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px
    }

    .spacer {
      flex: 1
    }

    .sync-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--bg);
      cursor: pointer;
      font-weight: 600
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #99a0b5;
      display: inline-block
    }

    .dot.ok {
      background: #2b8a3e;
      box-shadow: 0 0 0 3px rgba(43, 138, 62, .2)
    }

    .dot.wait {
      background: #f08c00
    }

    .dot.err {
      background: #e03131
    }

    .hud {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bar);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
      z-index: 15;
      user-select: none
    }

    .hud button {
      background: transparent;
      border: 0;
      border-radius: 6px;
      padding: 5px 9px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--ink)
    }

    .hud button:hover {
      background: var(--bg)
    }

    .hud .z-pct {
      min-width: 52px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 12px
    }

    .search-in {
      width: 165px;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--line)
    }

    .user-in {
      width: 115px;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 12.5px;
      background: var(--bg);
      border: 1px solid var(--line);
      font-weight: 600
    }

    .panel-checks {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--bg);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--line)
    }

    .panel-chk-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px
    }

    .panel-chk-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer
    }

    .panel-chk-item input[type="text"] {
      border: 0;
      background: transparent;
      padding: 2px 4px;
      flex: 1;
      font-size: 13px
    }

    .panel-chk-item button {
      background: transparent;
      border: 0;
      color: var(--mute);
      cursor: pointer;
      padding: 2px 5px
    }

    dialog {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;

<body>
  <header>
    <h1><img src="favicon.png" alt="" width="20" height="20" style="object-fit:contain;flex-shrink:0"

  <main>
    <!-- Panel lateral izquierdo fijo de Subgrupos -->

  <dialog id="cfg-modal">
    <h2>Sincronización en vivo (Supabase)</h2>

  </dialog>
  <datalist id="cats"></datalist><datalist id="whos"></datalist>

  <script>
    const DEFAULT_SB_URL = "https://ejfhjzbqjryndtbltmty.supabase.co";
    const DEFAULT_SB_KEY = "sb_publishable_4aMksgd002k2kdQXstVHPA_d2UxH2NT";
    const META_ID = 999999999;
    const META_BOARD = "__meta_subgrupos__";

    const DRIVE_SVG = `<svg viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>`;

    const COLORS = ["#ffd966", "#ff9f80", "#8fd9b6", "#7cc4f5", "#c9a6f5", "#f5a6cf", "#e9e9e4"];
    const PEER_COLORS = ["#e03131", "#1971c2", "#2f9e44", "#9c36b5", "#f08c00", "#0c8599"];
    const KEY = "tablero-assets-v2", CFG_KEY = "tablero-assets-cfg-v1", USER_KEY = "tablero-user-v1";

    let subgroups = [
      { id: "principal", name: "📋 General" },
      { id: "mecanicas", name: "⚙️ Mecánicas" },
      { id: "arte", name: "🎨 Assets de Arte" },
      { id: "audio", name: "🎵 Audio y SFX" }
    ];
    let catColors = {
      "Torres": COLORS[0],
      "Habilidades": COLORS[1],
      "UI": COLORS[2]
    };
    let subCols = {}; // Número de columnas por subgrupo (por defecto 5)
    let curSub = "principal";
    let S = { notes: [], filter: "Todos" }, sel = null, selSet = new Set(), sb = null, channel = null, saveTimers = {}, pendingRows = {}, qStr = "";
    let undoStack = [], cloudReqId = 0;
    let cam = { x: 0, y: 0, z: 1 }, camAnim = null, spaceDown = false;
    let myId = "u_" + Math.random().toString(36).slice(2, 9), myColor = PEER_COLORS[Math.floor(Math.random() * PEER_COLORS.length)];
    let myDevId = "";
    try { myDevId = localStorage.getItem("tablero-dev-id") || ""; if (!myDevId) { myDevId = "d_" + Math.random().toString(36).slice(2, 10); localStorage.setItem("tablero-dev-id", myDevId) } } catch (e) { myDevId = myId }
    let peers = {}, lastCursorSent = 0;
    const MIN_Z = 0.25, MAX_Z = 2.5, NOTE_W = 220, NOTE_H = 136;
    const COL_X0 = 32, COL_Y0 = 26, COL_STEP = 252, DEFAULT_COLS = 5;
    const $ = id => document.getElementById(id);

    function colX(c) { return COL_X0 + c * COL_STEP }
    function xToCol(x, maxCols) {
      const mc = maxCols || getNumCols();
      return Math.max(0, Math.min(mc - 1, Math.round(((x || 0) - COL_X0) / COL_STEP)));
    }
    function defaultTitleId(subId, c) {
      let h = 2166136261;
      for (let i = 0; i < subId.length; i++) h = Math.imul(h ^ subId.charCodeAt(i), 16777619);
      return (Math.abs(h) % 80000000) * 100 + c + 1;
    }
    function getNumCols() {
      let base = subCols[curSub] || DEFAULT_COLS;
      S.notes.forEach(n => {
        if (n.st === "titulo") {
          const c = Math.round(((n.x || 0) - COL_X0) / COL_STEP);
          if (c >= base && c < 25) base = c + 1;
        }
      });
      subCols[curSub] = Math.max(1, base);
      return subCols[curSub];
    }
    function ensureColumnTitles(pushNew = false) {
      const numCols = getNumCols();
      const titlesByCol = new Map();
      const extraTitles = [];
      S.notes.filter(n => n.st === "titulo").forEach(n => {
        const c = xToCol(n.x, numCols);
        if (!titlesByCol.has(c)) {
          n.x = colX(c);
          n.y = COL_Y0;
          titlesByCol.set(c, n);
        } else {
          extraTitles.push(n);
        }
      });
      for (let c = 0; c < numCols; c++) {
        if (!titlesByCol.has(c)) {
          const reused = extraTitles.shift();
          if (reused) {
            reused.x = colX(c);
            reused.y = COL_Y0;
            titlesByCol.set(c, reused);
            if (pushNew) pushNote(reused, 20);
          } else {
            const tn = {
              id: defaultTitleId(curSub, c),
              t: "Columna " + (c + 1),
              cat: "",
              who: "",
              st: "titulo",
              link: "",
              body: "",
              color: COLORS[c % COLORS.length],
              x: colX(c),
              y: COL_Y0
            };
            S.notes.push(tn);
            titlesByCol.set(c, tn);
            if (pushNew) pushNote(tn, 20);
          }
        }
      }
    }

    function cloneNotes(arr) { return JSON.parse(JSON.stringify(arr || [])) }
    function recordUndo() {
      undoStack.push(cloneNotes(S.notes));
      if (undoStack.length > 45) undoStack.shift();
    }
    function undo() {
      if (!undoStack.length) return;
      const prev = undoStack.pop();
      const prevMap = new Map(prev.map(n => [n.id, n]));
      const curMap = new Map(S.notes.map(n => [n.id, n]));
      // Notas que se crearon después del snapshot -> borrarlas de la nube
      const toDelete = [];
      curMap.forEach((_, id) => { if (!prevMap.has(id)) toDelete.push(id) });
      // Notas que se borraron o modificaron -> restaurarlas en la nube
      const toUpsert = [];
      prevMap.forEach((pn, id) => {
        const cn = curMap.get(id);
        if (!cn || JSON.stringify(cn) !== JSON.stringify(pn)) toUpsert.push(pn);
      });
      S.notes = prev;
      save();
      if (toDelete.length) deleteNotesRemote(toDelete);
      toUpsert.forEach(n => pushNote(n, 0));
      if (sel && !S.notes.some(n => n.id === sel)) { sel = null; selSet.clear(); $("panel").classList.remove("open") }
      render();
      if (sel) syncPanelFromNote(cur());
    }

    function getCatColor(cat, fallback) {
      const k = (cat || "").trim();
      if (!k) return fallback || COLORS[0];
      if (!catColors[k]) {
        const used = Object.keys(catColors).length;
        catColors[k] = fallback || COLORS[used % COLORS.length];
      }
      return catColors[k];
    }

    // --- Persistencia de usuario y configuración ---
    function initUser() {
      try { const u = localStorage.getItem(USER_KEY); if (u) $("me-name").value = u } catch (e) { }
      $("me-name").addEventListener("input", e => { try { localStorage.setItem(USER_KEY, e.target.value) } catch (err) { } });
    }
    function getCfg() {
      let c = { url: DEFAULT_SB_URL, key: DEFAULT_SB_KEY };
      try { const r = localStorage.getItem(CFG_KEY); if (r) { const p = JSON.parse(r); c = { url: p.url || c.url, key: p.key || c.key } } } catch (e) { }
      c.url = c.url.trim().replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
      return c;
    }
    function setStatus(state, msg) {
      $("sync-dot").className = "dot" + (state ? " " + state : "");
      $("sync-txt").textContent = msg;
    }

    // --- Cámara (Pan, Zoom y Animación Suave) ---
    function applyCam() {
      const sc = $("scroll"), b = $("board");
      b.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
      const gs = 26 * cam.z;
      sc.style.backgroundSize = `${gs}px ${gs}px`;
      sc.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
      $("z-rst").textContent = Math.round(cam.z * 100) + "%";
    }
    function animateCamTo(tx, ty, tz, dur = 320) {
      if (camAnim) cancelAnimationFrame(camAnim);
      const sx = cam.x, sy = cam.y, sz = cam.z, t0 = performance.now();
      function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
        cam.x = sx + (tx - sx) * e;
        cam.y = sy + (ty - sy) * e;
        cam.z = sz + (tz - sz) * e;
        applyCam();
        if (p < 1) camAnim = requestAnimationFrame(step);
        else camAnim = null;
      }
      camAnim = requestAnimationFrame(step);
    }
    function zoomAt(newZ, cx, cy) {
      if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null }
      const sc = $("scroll"), rect = sc.getBoundingClientRect();
      const px = cx !== undefined ? cx - rect.left : rect.width / 2;
      const py = cy !== undefined ? cy - rect.top : rect.height / 2;
      const clamped = Math.min(MAX_Z, Math.max(MIN_Z, newZ));
      const wx = (px - cam.x) / cam.z, wy = (py - cam.y) / cam.z;
      cam.z = clamped;
      cam.x = px - wx * cam.z;
      cam.y = py - wy * cam.z;
      applyCam();
    }
    function focusNoteSmooth(n) {
      const sc = $("scroll"), rect = sc.getBoundingClientRect();
      const targetZ = Math.max(cam.z, 1.08);
      const availW = rect.width - (window.innerWidth > 700 ? 325 : 0);
      const tx = availW / 2 - (n.x + NOTE_W / 2) * targetZ;
      const ty = rect.height / 2 - (n.y + NOTE_H / 2) * targetZ;
      animateCamTo(tx, ty, targetZ, 340);
    }
    function fitAll() {
      const vis = visibleNotes();
      if (!vis.length) { animateCamTo(0, 0, 1, 280); return }
      const sc = $("scroll"), rect = sc.getBoundingClientRect();
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      vis.forEach(n => {
        minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + NOTE_W); maxY = Math.max(maxY, n.y + NOTE_H);
      });
      const bw = maxX - minX, bh = maxY - minY, pad = 90;
      const zx = (rect.width - pad * 2) / Math.max(bw, 1), zy = (rect.height - pad * 2) / Math.max(bh, 1);
      const tz = Math.min(1.15, Math.max(MIN_Z, Math.min(zx, zy)));
      const tx = rect.width / 2 - (minX + bw / 2) * tz;
      const ty = rect.height / 2 - (minY + bh / 2) * tz;
      animateCamTo(tx, ty, tz, 320);
    }

    // --- Parseo de Checklists y Texto dentro de n.body ---
    function parseBody(raw) {
      const lines = (raw || "").split("\n");
      const checks = [], textLines = [];
      lines.forEach(l => {
        const m = l.match(/^\s*[-*]?\s*\[( |x|X)\]\s*(.*)$/);
        if (m) checks.push({ done: m[1].toLowerCase() === "x", text: m[2] });
        else textLines.push(l);
      });
      return { checks, text: textLines.join("\n").replace(/^\n+|\n+$/g, "") };
    }
    function serializeBody(checks, text) {
      const cPart = checks.map(c => `[${c.done ? "x" : " "}] ${c.text}`).join("\n");
      const tPart = (text || "").trim();
      if (cPart && tPart) return cPart + "\n" + tPart;
      return cPart || tPart;
    }

    // --- Subgrupos (Panel izquierdo con arrastrar y soltar) ---
    let subDragIdx = null;
    function renderSubgroups() {
      const w = $("sub-list"); w.textContent = "";
      subgroups.forEach((sg, idx) => {
        const d = document.createElement("div");
        d.className = "sub-item" + (sg.id === curSub ? " active" : "");
        d.draggable = true;
        const grip = document.createElement("span"); grip.className = "sub-grip"; grip.textContent = "⋮⋮"; grip.title = "Arrastrar para reordenar";
        d.appendChild(grip);
        const sp = document.createElement("span"); sp.className = "sub-name"; sp.textContent = sg.name;
        d.appendChild(sp);
        const editB = document.createElement("button"); editB.className = "sub-act"; editB.textContent = "✎"; editB.title = "Renombrar";
        editB.onclick = e => {
          e.stopPropagation();
          const nv = prompt("Nuevo nombre del subgrupo:", sg.name);
          if (nv && nv.trim()) { sg.name = nv.trim(); saveSubgroupsRemote(); renderSubgroups() }
        };
        d.appendChild(editB);
        if (subgroups.length > 1) {
          const delB = document.createElement("button"); delB.className = "sub-act"; delB.textContent = "🗑"; delB.title = "Eliminar subgrupo";
          delB.onclick = e => {
            e.stopPropagation();
            if (!confirm(`¿Eliminar el subgrupo "${sg.name}"?`)) return;
            subgroups = subgroups.filter(x => x.id !== sg.id);
            if (curSub === sg.id) switchSubgroup(subgroups[0].id);
            saveSubgroupsRemote(); renderSubgroups();
          };
          d.appendChild(delB);
        }
        d.addEventListener("dragstart", e => {
          subDragIdx = idx;
          d.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        d.addEventListener("dragover", e => {
          e.preventDefault();
          if (subDragIdx === null || subDragIdx === idx) return;
          const rect = d.getBoundingClientRect();
          const above = (e.clientY - rect.top) < rect.height / 2;
          d.classList.toggle("drop-above", above);
          d.classList.toggle("drop-below", !above);
        });
        d.addEventListener("dragleave", () => {
          d.classList.remove("drop-above", "drop-below");
        });
        d.addEventListener("drop", e => {
          e.preventDefault();
          d.classList.remove("drop-above", "drop-below");
          if (subDragIdx === null || subDragIdx === idx) return;
          const rect = d.getBoundingClientRect();
          const above = (e.clientY - rect.top) < rect.height / 2;
          const [moved] = subgroups.splice(subDragIdx, 1);
          let dest = subDragIdx < idx ? idx - 1 : idx;
          if (!above) dest++;
          subgroups.splice(dest, 0, moved);
          subDragIdx = null;
          saveSubgroupsRemote();
          renderSubgroups();
        });
        d.addEventListener("dragend", () => {
          subDragIdx = null;
          d.classList.remove("dragging", "drop-above", "drop-below");
        });
        d.onclick = () => switchSubgroup(sg.id);
        w.appendChild(d);
      });
    }
    function unpackMeta(raw) {
      try {
        const p = JSON.parse(raw);
        if (Array.isArray(p)) { subgroups = p }
        else if (p && typeof p === "object") {
          if (Array.isArray(p.subs) && p.subs.length) subgroups = p.subs;
          if (p.catColors && typeof p.catColors === "object") catColors = { ...catColors, ...p.catColors };
          if (p.subCols && typeof p.subCols === "object") subCols = { ...subCols, ...p.subCols };
        }
      } catch (e) { }
    }
    async function saveSubgroupsRemote() {
      const payload = { subs: subgroups, catColors, subCols };
      try { localStorage.setItem(KEY + "-subs", JSON.stringify(payload)) } catch (e) { }
      if (!sb) return;
      await sb.from("notes").upsert({
        id: META_ID, board: META_BOARD, t: "__subgrupos__", cat: "", who: "", st: "", link: "",
        body: JSON.stringify(payload), color: "#ffd966", x: 0, y: 0, updated_at: new Date().toISOString()
      });
    }
    function clearPeerCursors() {
      Object.values(peers).forEach(p => { clearTimeout(p.timer); p.el.remove() });
      peers = {};
    }
    function flushPendingSaves() {
      Object.keys(saveTimers).forEach(id => {
        clearTimeout(saveTimers[id]);
        delete saveTimers[id];
      });
      const rows = Object.values(pendingRows);
      pendingRows = {};
      if (sb && rows.length) {
        sb.from("notes").upsert(rows).then(({ error }) => { if (error) setStatus("err", "Error al guardar en nube") });
      }
    }
    function switchSubgroup(id) {
      if (curSub === id) return;
      flushPendingSaves();
      clearPeerCursors();
      curSub = id;
      sel = null; selSet.clear(); undoStack = []; $("panel").classList.remove("open");
      if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null }
      cam = { x: 0, y: 0, z: 1 };
      applyCam();
      renderSubgroups();
      loadLocalBoard();
      render();
      const curObj = subgroups.find(s => s.id === curSub);
      if (sb) setStatus("ok", `En vivo · ${curObj ? curObj.name : curSub}`);
      fetchSubgroupNotes(id);
    }

    function createSubFromInput() {
      const inp = $("new-sub-in"), name = inp.value.trim();
      if (!name) return;
      const slug = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || ("sub-" + Date.now());
      const id = subgroups.some(s => s.id === slug) ? slug + "-" + Date.now().toString().slice(-3) : slug;
      subgroups.push({ id, name });
      subCols[id] = DEFAULT_COLS;
      inp.value = "";
      saveSubgroupsRemote();
      renderSubgroups();
      switchSubgroup(id);
    }
    $("new-sub-add").onclick = createSubFromInput;
    $("new-sub-in").addEventListener("keydown", e => { if (e.key === "Enter") createSubFromInput() });

    // --- Almacenamiento local y Supabase ---
    function loadLocalBoard() {
      try { const subs = localStorage.getItem(KEY + "-subs"); if (subs) unpackMeta(subs) } catch (e) { }
      S = { notes: [], filter: "Todos" };
      let hadLocal = false;
      try { const r = localStorage.getItem(KEY + "-" + curSub); if (r) { S = JSON.parse(r); hadLocal = true; if (S.filter === "Todas") S.filter = "Todos" } } catch (e) { }
      if (!hadLocal && !S.notes.length && curSub === "principal") {
        S.notes = [
          { id: 1, t: "Torre de arco nivel 1", cat: "Torres", who: "Ana", st: "", link: "", body: "[x] Boceto base\n[ ] Animación de disparo\nRevisar escala con el mapa.", color: COLORS[0], x: colX(0), y: 140 },
          { id: 2, t: "Torre de hielo", cat: "Torres", who: "Beto", st: "", link: "", body: "[ ] Definir paleta de azules", color: COLORS[0], x: colX(1), y: 140 },
          { id: 3, t: "Habilidad: bola de fuego", cat: "Habilidades", who: "Ana", st: "", link: "", body: "[ ] Definir VFX\n[ ] Sonido de impacto", color: COLORS[1], x: colX(0), y: 310 },
          { id: 4, t: "Iconos de maná", cat: "UI", who: "Beto", st: "", link: "", body: "", color: COLORS[2], x: colX(2), y: 140 }
        ];
      }
      ensureColumnTitles(false);
      S.notes.forEach(n => { if (n.cat) n.color = getCatColor(n.cat, n.color) });
    }
    function save(boardId = curSub, stateObj = S) { try { localStorage.setItem(KEY + "-" + boardId, JSON.stringify(stateObj)) } catch (e) { } }

    async function pushNote(n, delay = 0, boardOverride) {
      const targetBoard = boardOverride || curSub;
      if (targetBoard === curSub) save(targetBoard, S);
      if (!sb) return;
      const row = { id: n.id, board: targetBoard, t: n.t || "", cat: n.cat || "", who: n.who || "", st: n.st === "titulo" ? "titulo" : "", link: n.link || "", body: n.body || "", color: n.color || COLORS[0], x: Math.round(n.x || 0), y: Math.round(n.y || 0), updated_at: new Date().toISOString() };
      pendingRows[n.id] = row;
      clearTimeout(saveTimers[n.id]);
      saveTimers[n.id] = setTimeout(async () => {
        delete saveTimers[n.id];
        const rToSend = pendingRows[n.id] || row;
        delete pendingRows[n.id];
        const { error } = await sb.from("notes").upsert(rToSend);
        if (error) setStatus("err", "Error al guardar en nube");
      }, delay);
    }
    async function deleteNotesRemote(ids) {
      save(curSub, S);
      ids.forEach(id => { clearTimeout(saveTimers[id]); delete saveTimers[id]; delete pendingRows[id] });
      if (!sb || !ids.length) return;
      const { error } = await sb.from("notes").delete().in("id", ids);
      if (error) setStatus("err", "Error al borrar en nube");
    }

    async function fetchSubgroupNotes(targetSub) {
      if (!sb) return;
      const reqId = ++cloudReqId;
      try {
        const { data, error } = await sb.from("notes").select("*").eq("board", targetSub).order("id", { ascending: true });
        if (error) throw error;
        if (reqId !== cloudReqId || curSub !== targetSub) return;
        S.notes = (data || []).map(r => ({ id: Number(r.id), t: r.t, cat: r.cat, who: r.who, st: r.st === "titulo" ? "titulo" : "", link: r.link, body: r.body, color: r.cat ? getCatColor(r.cat, r.color) : r.color, x: r.x, y: r.y }));
        ensureColumnTitles(true);
        save(targetSub, S);
        render();
        if (sel && S.notes.some(n => n.id === sel)) select(sel, false);
      } catch (err) {
        console.error(err);
      }
    }

    async function initCloud() {
      const cfg = getCfg();
      if (!cfg.url || !cfg.key || !window.supabase) {
        setStatus("", "Modo local (Conectar nube)");
        return;
      }
      try {
        setStatus("wait", "Conectando…");
        if (channel && sb) { await sb.removeChannel(channel); channel = null }
        if (!sb) sb = window.supabase.createClient(cfg.url.trim(), cfg.key.trim());

        const { data: metaData } = await sb.from("notes").select("body").eq("id", META_ID).maybeSingle();
        if (metaData && metaData.body) {
          unpackMeta(metaData.body);
          renderSubgroups();
        } else {
          await saveSubgroupsRemote();
        }

        await fetchSubgroupNotes(curSub);

        channel = sb.channel("room-global", { config: { broadcast: { self: false } } })
          .on("postgres_changes", { event: "*", schema: "public", table: "notes" }, payload => {
            const r = payload.new || payload.old;
            if (r && Number(r.id) === META_ID && payload.new?.body) {
              unpackMeta(payload.new.body);
              S.notes.forEach(n => { if (n.cat && catColors[n.cat]) n.color = catColors[n.cat] });
              renderSubgroups(); render(); if (sel) syncPanelFromNote(cur());
              return;
            }
            if (payload.eventType === "DELETE") {
              const delId = Number(payload.old.id);
              if (S.notes.some(n => n.id === delId)) {
                S.notes = S.notes.filter(n => n.id !== delId);
                selSet.delete(delId);
                if (sel === delId) { sel = null; $("panel").classList.remove("open") }
                save(curSub, S); render();
              }
            } else if (payload.new && payload.new.board === curSub) {
              const nr = payload.new;
              const incoming = { id: Number(nr.id), t: nr.t, cat: nr.cat, who: nr.who, st: nr.st === "titulo" ? "titulo" : "", link: nr.link, body: nr.body, color: nr.cat ? getCatColor(nr.cat, nr.color) : nr.color, x: nr.x, y: nr.y };
              const idx = S.notes.findIndex(n => n.id === incoming.id);
              if (idx >= 0) S.notes[idx] = incoming; else S.notes.push(incoming);
              save(curSub, S); render();
              if (sel === incoming.id) syncPanelFromNote(incoming);
            }
          })
          .on("broadcast", { event: "cursor" }, ({ payload }) => {
            if (!payload || payload.id === myId || payload.devId === myDevId) return;
            if (payload.sub !== curSub) {
              if (peers[payload.id]) { peers[payload.id].el.remove(); delete peers[payload.id] }
              return;
            }
            renderPeerCursor(payload);
          })
          .subscribe(status => {
            if (status === "SUBSCRIBED") {
              const curObj = subgroups.find(s => s.id === curSub);
              setStatus("ok", `En vivo · ${curObj ? curObj.name : curSub}`);
            }
          });
      } catch (err) {
        console.error(err);
        const msg = (err && err.message || "").toLowerCase();
        if (err && err.code === "PGRST205" || err && err.code === "42P01" || msg.includes("notes")) setStatus("err", "Falta correr el SQL en Supabase");
        else setStatus("err", "Error de conexión");
      }
    }

    // --- Cursores en vivo ---
    function renderPeerCursor(p) {
      let peer = peers[p.id];
      if (!peer) {
        const el = document.createElement("div");
        el.className = "peer-cursor";
        el.innerHTML = `<svg viewBox="0 0 24 24"><path fill="${p.color || "#3b5bdb"}" stroke="#fff" stroke-width="1.8" d="M4 2l16 10-7 2-3 7z"/></svg><span class="peer-tag" style="background:${p.color || "#3b5bdb"}"></span>`;
        $("board").appendChild(el);
        peer = peers[p.id] = { el, timer: null };
      }
      peer.el.querySelector(".peer-tag").textContent = p.name || "Compañero/a";
      peer.el.style.transform = `translate(${p.x}px,${p.y}px)`;
      clearTimeout(peer.timer);
      peer.timer = setTimeout(() => { peer.el.remove(); delete peers[p.id] }, 10000);
    }
    $("scroll").addEventListener("pointermove", e => {
      if (!channel) return;
      const now = performance.now();
      if (now - lastCursorSent < 55) return;
      lastCursorSent = now;
      const rect = $("scroll").getBoundingClientRect();
      const wx = Math.round((e.clientX - rect.left - cam.x) / cam.z);
      const wy = Math.round((e.clientY - rect.top - cam.y) / cam.z);
      channel.send({
        type: "broadcast", event: "cursor", payload: {
          id: myId, devId: myDevId, name: $("me-name").value.trim() || "Invitado/a", color: myColor, x: wx, y: wy, sub: curSub
        }
      });
    });

    function href(u) { return /^https?:\/\//i.test(u) ? u : "https://" + u }
    function visibleNotes() {
      const q = qStr.trim().toLowerCase();
      return S.notes.filter(n => {
        if (n.st === "titulo") return true; // Los títulos de columna siempre permanecen visibles hasta arriba
        if (S.filter !== "Todos") {
          const w = (n.who || "").trim();
          if (S.filter === "Sin asignar") {
            if (w) return false;
          } else if (w !== S.filter) {
            return false;
          }
        }
        if (!q) return true;
        return [n.t, n.cat, n.who, n.body].some(v => (v || "").toLowerCase().includes(q));
      });
    }

    // --- Renderizado del Tablero por Columnas y Auto-apilado ---
    function layoutColumns(pushChanged = false) {
      const b = $("board");
      const numCols = getNumCols();
      b.querySelectorAll(".col-lane,.col-add-note,.add-col-btn").forEach(el => el.remove());

      for (let c = 0; c < numCols; c++) {
        const cx = colX(c);
        const lane = document.createElement("div");
        lane.className = "col-lane";
        lane.dataset.col = c;
        lane.style.left = (cx - 8) + "px";
        lane.style.top = (COL_Y0 - 8) + "px";
        b.appendChild(lane);

        // Posicionar el post-it de título de esta columna hasta arriba
        const tNote = S.notes.find(n => n.st === "titulo" && xToCol(n.x, numCols) === c);
        let curY = COL_Y0 + 78 + 16;
        if (tNote) {
          const changed = tNote.x !== cx || tNote.y !== COL_Y0;
          tNote.x = cx;
          tNote.y = COL_Y0;
          const tEl = b.querySelector(`.note[data-id="${tNote.id}"]`);
          if (tEl) {
            if (!tEl.classList.contains("grabbed")) {
              tEl.style.left = cx + "px";
              tEl.style.top = COL_Y0 + "px";
            }
            curY = COL_Y0 + (tEl.offsetHeight || 78) + 16;
          }
          if (pushChanged && changed) pushNote(tNote, 30);
        }

        // Apilar automáticamente las notas de esta columna una debajo de otra
        const colNotes = visibleNotes()
          .filter(n => n.st !== "titulo" && xToCol(n.x, numCols) === c)
          .sort((a, b2) => (a.y - b2.y) || (a.id - b2.id));

        colNotes.forEach(n => {
          const el = b.querySelector(`.note[data-id="${n.id}"]`);
          const changed = n.x !== cx || n.y !== curY;
          n.x = cx;
          n.y = curY;
          if (el) {
            if (!el.classList.contains("grabbed")) {
              el.style.left = cx + "px";
              el.style.top = curY + "px";
            }
            curY += (el.offsetHeight || NOTE_H) + 14;
          } else {
            curY += NOTE_H + 14;
          }
          if (pushChanged && changed) pushNote(n, 30);
        });

        lane.style.height = Math.max(380, curY - COL_Y0 + 58) + "px";

        // Botón "+ Añadir nota" al final de cada columna
        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.className = "col-add-note";
        addBtn.textContent = "+ Añadir nota";
        addBtn.style.left = cx + "px";
        addBtn.style.top = (curY + 2) + "px";
        addBtn.onpointerdown = ev => ev.stopPropagation();
        addBtn.onclick = ev => {
          ev.stopPropagation();
          addNoteInCol(c);
        };
        b.appendChild(addBtn);
      }

      // Botón "+" a la derecha de la última columna para agregar una nueva columna
      const newColBtn = document.createElement("button");
      newColBtn.type = "button";
      newColBtn.className = "add-col-btn";
      newColBtn.textContent = "+";
      newColBtn.title = "Agregar nueva columna";
      newColBtn.style.left = colX(numCols) + "px";
      newColBtn.style.top = COL_Y0 + "px";
      newColBtn.onpointerdown = ev => ev.stopPropagation();
      newColBtn.onclick = ev => {
        ev.stopPropagation();
        recordUndo();
        playSfx("spawn");
        const nextC = getNumCols();
        subCols[curSub] = nextC + 1;
        ensureColumnTitles(true);
        saveSubgroupsRemote();
        render();
        const newTitle = S.notes.find(n => n.st === "titulo" && xToCol(n.x, subCols[curSub]) === nextC);
        if (newTitle) {
          select(newTitle.id, false);
          $("f-t").focus(); $("f-t").select();
          spawnDust(newTitle.x, newTitle.y, NOTE_W, 78);
        }
      };
      b.appendChild(newColBtn);
    }

    function render() {
      ensureColumnTitles(false);
      const b = $("board");
      b.querySelectorAll(".note").forEach(el => el.remove());
      visibleNotes().forEach(n => {
        const isSelected = selSet.has(n.id) || n.id === sel;
        const isTitle = n.st === "titulo";
        const noteColor = n.cat ? getCatColor(n.cat, n.color) : (n.color || COLORS[0]);
        n.color = noteColor;
        const d = document.createElement("div");
        d.className = "note" + (isTitle ? " is-title" : "") + (isSelected ? " sel" : "");
        d.dataset.id = n.id;
        d.style.cssText = `left:${n.x}px;top:${n.y}px;background:${noteColor}`;
        const t = document.createElement("b"); t.textContent = n.t || "Sin título"; d.appendChild(t);

        if (!isTitle) {
          const { checks, text } = parseBody(n.body);
          if (text) {
            const bd = document.createElement("div"); bd.className = "note-body"; bd.textContent = text; d.appendChild(bd);
          }
          if (checks.length) {
            const cw = document.createElement("div"); cw.className = "note-checks";
            checks.forEach((c, idx) => {
              const row = document.createElement("label"); row.className = "chk-row" + (c.done ? " done" : "");
              row.onpointerdown = ev => ev.stopPropagation();
              const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = c.done;
              cb.onchange = () => {
                recordUndo();
                checks[idx].done = cb.checked;
                playSfx(cb.checked ? "check" : "drop");
                n.body = serializeBody(checks, text);
                pushNote(n, 50); render();
                if (sel === n.id) syncPanelFromNote(n);
              };
              const sp = document.createElement("span"); sp.textContent = c.text;
              row.append(cb, sp); cw.appendChild(row);
            });
            d.appendChild(cw);
          }

          if (n.link && n.link.trim()) {
            const a = document.createElement("a");
            a.className = "drive-btn"; a.href = href(n.link.trim()); a.target = "_blank"; a.rel = "noopener";
            a.innerHTML = `${DRIVE_SVG}<span>Google Drive</span>`;
            a.onpointerdown = ev => ev.stopPropagation();
            d.appendChild(a);
          }

          const tags = document.createElement("div"); tags.className = "tags";
          if (n.cat) { const c = document.createElement("span"); c.className = "tag"; c.textContent = n.cat; tags.appendChild(c) }
          if (checks.length) {
            const doneCnt = checks.filter(c => c.done).length;
            const cs = document.createElement("span"); cs.className = "tag"; cs.textContent = `✓ ${doneCnt}/${checks.length}`; tags.appendChild(cs);
          }
          if (tags.childNodes.length) d.appendChild(tags);

          const m = document.createElement("div"); m.className = "meta";
          m.textContent = n.who || "Sin asignar";
          d.appendChild(m);

          // Botones + en circulito arriba y abajo en las notas de cada columna
          ["top", "bot"].forEach(pos => {
            const qb = document.createElement("button");
            qb.type = "button";
            qb.className = "q-dup " + pos;
            qb.textContent = "+";
            qb.title = pos === "top" ? "Duplicar nota arriba" : "Duplicar nota abajo";
            qb.onpointerdown = ev => ev.stopPropagation();
            qb.onclick = ev => {
              ev.stopPropagation();
              recordUndo();
              playSfx("spawn");
              const ny = pos === "top" ? n.y - 5 : n.y + 5;
              const copy = { ...JSON.parse(JSON.stringify(n)), id: Date.now(), x: n.x, y: ny };
              S.notes.push(copy);
              selSet.clear(); selSet.add(copy.id);
              render();
              layoutColumns(true);
              pushNote(copy, 0);
              select(copy.id, false);
              const cEl = document.querySelector(`.note[data-id="${copy.id}"]`);
              spawnDust(copy.x, copy.y, NOTE_W, cEl ? cEl.offsetHeight : NOTE_H);
            };
            d.appendChild(qb);
          });
        }

        d.addEventListener("pointerdown", e => dragNote(e, n, d));
        b.appendChild(d);
      });
      layoutColumns(false);
      chips(); lists();
    }
    function chips() {
      const whos = [...new Set(S.notes.map(n => (n.who || "").trim()).filter(Boolean))];
      const hasUnassigned = S.notes.some(n => n.st !== "titulo" && !(n.who || "").trim());
      const cs = ["Todos", ...whos, ...(hasUnassigned ? ["Sin asignar"] : [])];
      if (!cs.includes(S.filter)) S.filter = "Todos";
      const w = $("chips"); w.textContent = "";
      cs.forEach(c => {
        const x = document.createElement("button"); x.className = "chip" + (c === S.filter ? " on" : "");
        x.textContent = c === "Todos" ? "👥 Todos" : (c === "Sin asignar" ? "Sin asignar" : "👤 " + c);
        x.onclick = () => { S.filter = c; render() };
        w.appendChild(x);
      });
    }
    function lists() {
      $("cats").innerHTML = [...new Set([...Object.keys(catColors), ...S.notes.map(n => n.cat).filter(Boolean)])].map(c => `<option value="${c.replace(/"/g, "&quot;")}">`).join("");
      $("whos").innerHTML = [...new Set(S.notes.map(n => n.who).filter(Boolean))].map(c => `<option value="${c.replace(/"/g, "&quot;")}">`).join("")
    }

    // --- Sintetizador de Sonidos estilo Nintendo (Web Audio API) y Polvito Vectorial ---
    let audioCtx = null, sfxMuted = false;
    try { sfxMuted = localStorage.getItem("tablero-sfx-mute") === "1" } catch (e) {}
    function updateSfxBtn() {
      const b = $("z-sfx");
      if (b) b.textContent = sfxMuted ? "🔇" : "🔊";
    }
    updateSfxBtn();
    $("z-sfx").onclick = () => {
      sfxMuted = !sfxMuted;
      try { localStorage.setItem("tablero-sfx-mute", sfxMuted ? "1" : "0") } catch (e) {}
      updateSfxBtn();
      if (!sfxMuted) playSfx("pickup");
    };

    function playSfx(kind) {
      if (sfxMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (kind === "pickup") {
          // "Pop" agudo y redondito hacia arriba al levantar la tarjeta
          osc.type = "sine";
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(590, now + 0.068);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (kind === "drop") {
          // "Plop / Thump" cálido al soltar la tarjeta en el tablero
          osc.type = "triangle";
          osc.frequency.setValueAtTime(310, now);
          osc.frequency.exponentialRampToValueAtTime(115, now + 0.085);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (kind === "spawn") {
          // Burbuja / Pop doble al crear o duplicar nota
          osc.type = "sine";
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.085);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.17, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.095);
        } else if (kind === "check") {
          // Ding alegre estilo Nintendo al completar subtarea
          osc.type = "triangle";
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.055); // A5
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.16, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.19);
        }
      } catch (e) {}
    }

    function spawnDust(x, y, w, h) {
      const b = $("board");
      const puffs = [
        // Esquina y borde inferior izquierdo
        { sx: x + 12, sy: y + h - 4, dx: -34, dy: 14, sz: 18 },
        { sx: x + 4, sy: y + h - 18, dx: -28, dy: -6, sz: 13 },
        // Centro inferior
        { sx: x + w * 0.35, sy: y + h, dx: -12, dy: 24, sz: 15 },
        { sx: x + w * 0.65, sy: y + h, dx: 14, dy: 22, sz: 16 },
        // Esquina y borde inferior derecho
        { sx: x + w - 12, sy: y + h - 4, dx: 36, dy: 14, sz: 19 },
        { sx: x + w - 4, sy: y + h - 18, dx: 28, dy: -6, sz: 13 },
        // Costados superiores
        { sx: x + 6, sy: y + 18, dx: -24, dy: -14, sz: 12 },
        { sx: x + w - 6, sy: y + 18, dx: 24, dy: -14, sz: 12 }
      ];
      puffs.forEach(p => {
        const el = document.createElement("div");
        el.className = "dust-puff";
        const jx = (Math.random() - 0.5) * 8, jy = (Math.random() - 0.5) * 8;
        el.style.width = p.sz + "px";
        el.style.height = p.sz + "px";
        el.style.left = p.sx + "px";
        el.style.top = p.sy + "px";
        el.style.setProperty("--dx", Math.round(p.dx + jx) + "px");
        el.style.setProperty("--dy", Math.round(p.dy + jy) + "px");
        b.appendChild(el);
        setTimeout(() => el.remove(), 440);
      });
    }

    // --- Arrastre a Columnas con Auto-acomodo, Físicas de Tambaleo y Polvito ---
    function dragNote(e, n, d) {
      if (e.button === 1 || spaceDown) return;
      if (e.button !== 0) return;
      e.stopPropagation();

      if (e.shiftKey && n.st !== "titulo") {
        if (selSet.has(n.id)) selSet.delete(n.id); else selSet.add(n.id);
        sel = n.id;
        updateSelectionUI();
        playSfx("pickup");
        return;
      }
      if (!selSet.has(n.id) || n.st === "titulo") {
        selSet.clear(); selSet.add(n.id);
      }
      sel = n.id;
      updateSelectionUI();

      const isTitleDrag = n.st === "titulo";
      const numCols = getNumCols();
      const startCol = xToCol(n.x, numCols);
      const movingNotes = isTitleDrag ? [n] : S.notes.filter(x => selSet.has(x.id) && x.st !== "titulo");
      const movingEls = movingNotes.map(mn => ({ mn, el: document.querySelector(`.note[data-id="${mn.id}"]`) })).filter(x => x.el);
      const origPos = new Map(movingNotes.map(x => [x.id, { x: x.x, y: x.y }]));
      const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
      let moved = false, lastX = e.clientX, tilt = 0;
      let hoverCol = startCol, insertSortY = n.y;

      playSfx("pickup");
      movingEls.forEach(({ el }) => {
        el.classList.remove("landed");
        el.classList.add("grabbed", "wobble-start");
        setTimeout(() => el.classList.remove("wobble-start"), 330);
      });

      d.setPointerCapture(e.pointerId); d.style.cursor = "grabbing";
      const dropSlot = $("drop-slot");

      const mv = ev => {
        const dx = (ev.clientX - sx) / cam.z, dy = (ev.clientY - sy) / cam.z;
        if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4) {
          recordUndo();
          moved = true;
        }
        const vx = ev.clientX - lastX;
        lastX = ev.clientX;
        const targetTilt = Math.max(-13, Math.min(13, vx * 0.65));
        tilt = tilt * 0.65 + targetTilt * 0.35;

        const targetX = Math.round(ox + dx), targetY = Math.round(oy + dy);
        hoverCol = xToCol(targetX, numCols);

        // Resaltar la columna destino
        document.querySelectorAll(".col-lane").forEach(ln => {
          ln.classList.toggle("active-col", +ln.dataset.col === hoverCol);
        });

        if (!isTitleDrag && moved) {
          // Calcular en qué hueco vertical de la columna destino caerá la nota
          const colPeers = visibleNotes()
            .filter(x => x.st !== "titulo" && !selSet.has(x.id) && xToCol(x.x, numCols) === hoverCol)
            .sort((a, b2) => (a.y - b2.y) || (a.id - b2.id));

          const tNote = S.notes.find(x => x.st === "titulo" && xToCol(x.x, numCols) === hoverCol);
          const tEl = tNote ? document.querySelector(`.note[data-id="${tNote.id}"]`) : null;
          const topBase = COL_Y0 + (tEl ? tEl.offsetHeight : 78) + 16;

          let slotY = topBase - 8;
          insertSortY = topBase - 20;

          for (let i = 0; i < colPeers.length; i++) {
            const p = colPeers[i];
            const pEl = document.querySelector(`.note[data-id="${p.id}"]`);
            const pH = pEl ? pEl.offsetHeight : NOTE_H;
            const midY = p.y + pH / 2;
            if (targetY + 30 > midY) {
              slotY = p.y + pH + 4;
              const nextP = colPeers[i + 1];
              insertSortY = nextP ? (p.y + nextP.y) / 2 : p.y + pH + 50;
            }
          }
          dropSlot.style.left = colX(hoverCol) + "px";
          dropSlot.style.top = slotY + "px";
          dropSlot.style.display = "block";
        }

        movingEls.forEach(({ mn, el }) => {
          const op = origPos.get(mn.id);
          mn.x = op.x + (targetX - ox);
          mn.y = isTitleDrag ? COL_Y0 : op.y + (targetY - oy);
          el.style.left = mn.x + "px";
          el.style.top = mn.y + "px";
          el.style.setProperty("--tilt", tilt.toFixed(2) + "deg");
        });
      };

      const up = () => {
        d.removeEventListener("pointermove", mv); d.removeEventListener("pointerup", up);
        d.style.cursor = "";
        dropSlot.style.display = "none";
        document.querySelectorAll(".col-lane.active-col").forEach(ln => ln.classList.remove("active-col"));

        movingEls.forEach(({ el }) => {
          el.classList.remove("grabbed", "wobble-start");
          el.style.setProperty("--tilt", "0deg");
        });

        if (moved) {
          if (isTitleDrag) {
            // Si arrastramos el Título de una columna a otra, intercambiamos ambas columnas completas
            if (hoverCol !== startCol) {
              const colANotes = S.notes.filter(x => x.id === n.id || (x.st !== "titulo" && xToCol(x.x, numCols) === startCol));
              const colBNotes = S.notes.filter(x => x.id !== n.id && xToCol(x.x, numCols) === hoverCol);
              colANotes.forEach(x => { x.x = colX(hoverCol); pushNote(x, 20) });
              colBNotes.forEach(x => { x.x = colX(startCol); pushNote(x, 20) });
            } else {
              n.x = colX(startCol); n.y = COL_Y0;
            }
          } else {
            // Acomodar las notas arrastradas en su lugar dentro de la columna destino
            const sortedMoving = [...movingNotes].sort((a, b2) => (origPos.get(a.id).y - origPos.get(b2.id).y));
            sortedMoving.forEach((mn, idx) => {
              mn.x = colX(hoverCol);
              mn.y = insertSortY + idx * 0.5;
            });
          }
          layoutColumns(true);
          movingNotes.forEach(mn => pushNote(mn, 20));
          playSfx("drop");
          movingEls.forEach(({ mn, el }) => {
            el.classList.add("landed");
            setTimeout(() => el.classList.remove("landed"), 300);
            const h = el.offsetHeight || (mn.st === "titulo" ? 78 : NOTE_H);
            spawnDust(mn.x, mn.y, NOTE_W, h);
          });
        } else {
          playSfx("drop");
          select(n.id, false);
        }
      };
      d.addEventListener("pointermove", mv); d.addEventListener("pointerup", up);
    }

    function cur() { return S.notes.find(n => n.id === sel) }
    function updateSelectionUI() {
      document.querySelectorAll(".note").forEach(el => {
        const id = +el.dataset.id;
        el.classList.toggle("sel", selSet.has(id) || id === sel);
      });
      const mb = $("multi-badge");
      if (selSet.size > 1) {
        mb.style.display = "block";
        mb.textContent = `${selSet.size} notas seleccionadas`;
      } else mb.style.display = "none";
    }
    function select(id, smoothZoom = false) {
      sel = id;
      if (!selSet.has(id)) { selSet.clear(); selSet.add(id) }
      updateSelectionUI();
      const n = cur(); if (!n) return;
      $("panel").classList.add("open");
      syncPanelFromNote(n);
      if (smoothZoom) focusNoteSmooth(n);
    }

    function syncPanelFromNote(n) {
      if (!n) return;
      const isTitle = n.st === "titulo";
      $("title-badge").style.display = isTitle ? "block" : "none";
      $("normal-fields").style.display = isTitle ? "none" : "flex";
      $("lbl-who").style.display = isTitle ? "none" : "flex";
      $("dup").style.display = isTitle ? "none" : "";
      $("del").textContent = isTitle ? "Borrar columna" : "Borrar";

      const active = document.activeElement;
      const { checks, text } = parseBody(n.body);
      if (active !== $("f-t")) $("f-t").value = n.t;
      if (active !== $("f-cat")) $("f-cat").value = n.cat;
      if (active !== $("f-who")) $("f-who").value = n.who;
      if (active !== $("f-link")) $("f-link").value = n.link;
      if (active !== $("f-body")) $("f-body").value = text;
      renderPanelChecks(n, checks, text);
      paintSw(); link();
    }

    function renderPanelChecks(n, checks, text) {
      const w = $("p-checks"); w.textContent = "";
      if (!checks.length) {
        w.innerHTML = `<div style="font-size:12px;color:var(--mute)">Sin subtareas todavía.</div>`;
        return;
      }
      checks.forEach((c, idx) => {
        const row = document.createElement("div"); row.className = "panel-chk-item";
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = c.done;
        cb.onchange = () => {
          recordUndo();
          checks[idx].done = cb.checked;
          playSfx(cb.checked ? "check" : "drop");
          n.body = serializeBody(checks, $("f-body").value);
          pushNote(n, 50); render(); renderPanelChecks(n, checks, $("f-body").value);
        };
        const inp = document.createElement("input"); inp.type = "text"; inp.value = c.text;
        if (c.done) inp.style.textDecoration = "line-through";
        inp.onfocus = () => recordUndo();
        inp.oninput = () => {
          checks[idx].text = inp.value;
          n.body = serializeBody(checks, $("f-body").value);
          pushNote(n, 200); render();
        };
        const del = document.createElement("button"); del.textContent = "✕"; del.title = "Quitar subtarea";
        del.onclick = () => {
          recordUndo();
          checks.splice(idx, 1);
          n.body = serializeBody(checks, $("f-body").value);
          pushNote(n, 50); render(); renderPanelChecks(n, checks, $("f-body").value);
        };
        row.append(cb, inp, del); w.appendChild(row);
      });
    }
    function addCheckFromPanel() {
      const n = cur(); if (!n) return;
      const inp = $("chk-new"), val = inp.value.trim();
      if (!val) return;
      recordUndo();
      const { checks, text } = parseBody(n.body);
      checks.push({ done: false, text: val });
      inp.value = "";
      n.body = serializeBody(checks, text);
      pushNote(n, 50); render(); layoutColumns(true); syncPanelFromNote(n);
    }
    $("chk-add-btn").onclick = addCheckFromPanel;
    $("chk-new").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addCheckFromPanel() } });

    function link() {
      const n = cur(), a = $("open");
      if (n && n.st !== "titulo" && n.link && n.link.trim()) {
        a.href = href(n.link.trim());
        a.innerHTML = `${DRIVE_SVG}<span>Google Drive</span>`;
        a.style.display = "inline-flex";
      } else a.style.display = "none";
    }

    // --- Selector circular de color y Lista desplegable de Categorías del Subgrupo ---
    $("cat-dot-btn").onclick = e => {
      e.stopPropagation();
      $("cat-dd").classList.remove("open");
      $("cat-pop").classList.toggle("open");
    };
    function openCatDropdown() {
      const dd = $("cat-dd");
      dd.textContent = "";
      const subCats = [...new Set(S.notes.map(x => (x.cat || "").trim()).filter(Boolean))];
      if (!subCats.length) {
        dd.classList.remove("open");
        return;
      }
      subCats.forEach(catName => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-dd-item";
        const dot = document.createElement("span");
        dot.className = "cat-dd-dot";
        dot.style.background = getCatColor(catName);
        const txt = document.createElement("span");
        txt.textContent = catName;
        btn.append(dot, txt);
        btn.onpointerdown = ev => {
          ev.preventDefault();
          ev.stopPropagation();
          const n = cur();
          if (!n) return;
          recordUndo();
          $("f-cat").value = catName;
          const clr = getCatColor(catName);
          const targets = selSet.size > 1 ? S.notes.filter(x => selSet.has(x.id)) : [n];
          targets.forEach(t => { t.cat = catName; t.color = clr; pushNote(t, 50) });
          dd.classList.remove("open");
          paintSw();
          render();
        };
        dd.appendChild(btn);
      });

      dd.classList.add("open");
