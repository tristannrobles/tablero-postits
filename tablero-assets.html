    function touchPeerPresence(p) {
      if (!p || p.id === myId || p.devId === myDevId) return;
      const key = p.devId || p.id;
      if (p.leave) {
        if (activePeers[key]) {
          clearTimeout(activePeers[key].timer);
          delete activePeers[key];
          updateOnlinePeersUI();
        }
        return;
      }
      const prev = activePeers[key];
      if (prev) clearTimeout(prev.timer);
      const name = (p.name || "").trim() || "Invitado/a";
      const sub = p.sub || "principal";
      const color = p.color || "#098967";
      const working = !!p.working;
      if (name && name !== "Invitado/a" && typeof p.secs === "number") {
        workSecs[name] = Math.max(workSecs[name] || 0, p.secs);
      }
      const changed = !prev || prev.name !== name || prev.sub !== sub || prev.working !== working;
      const timer = setTimeout(() => {
        delete activePeers[key];
        updateOnlinePeersUI();
        if ($("rank-pop").classList.contains("open")) renderRankingPop();
      }, 9500);
      activePeers[key] = { name, sub, color, working, timer };
      if (changed) updateOnlinePeersUI();
      if ($("rank-pop").classList.contains("open")) renderRankingPop();
    }

    function toggleMobDrawer(force) {
      const dr = $("sub-drawer"), bd = $("mob-backdrop");
      const open = force !== undefined ? force : !dr.classList.contains("mob-open");
      dr.classList.toggle("mob-open", open);
      bd.classList.toggle("open", open);
    }
    $("mob-sub-btn").onclick = e => { e.stopPropagation(); playSfx("pickup"); toggleMobDrawer() };
    $("mob-sub-close").onclick = () => toggleMobDrawer(false);
    $("mob-backdrop").onclick = () => toggleMobDrawer(false);
    $("mob-tools-btn").onclick = e => {
      e.stopPropagation();
      playSfx("pickup");
      const hdr = $("hdr");
      const open = hdr.classList.toggle("mob-tools-open");
      if (open) setTimeout(() => $("q").focus(), 60);
    };

    function switchSubgroup(id) {
      initialSubPicked = true;
      toggleMobDrawer(false);
      if (curSub === id) return;
      closeSubEditPop();
      flushPendingSaves();
      clearPeerCursors();
      curSub = id;
      sel = null; selSet.clear(); undoStack = []; $("panel").classList.remove("open");
      if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null }
      cam = { x: 0, y: 0, z: 1 };
      applyCam();
      renderSubgroups();
      loadLocalBoard();
      render();
      const curObj = subgroups.find(s => s.id === curSub);
      if (sb) setStatus("ok", `En vivo · ${curObj ? curObj.name : curSub}`);
      sendPresencePing();
      fetchSubgroupNotes(id);
    }

    function createSubFromInput() {
      const inp = $("new-sub-in"), name = inp.value.trim();
      if (!name) return;
      playSfx("spawn");
      const slug = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || ("sub-" + Date.now());
      const id = subgroups.some(s => s.id === slug) ? slug + "-" + Date.now().toString().slice(-3) : slug;
      const color = COLORS[subgroups.length % COLORS.length];
      subgroups.push({ id, name, color });
      subCols[id] = DEFAULT_COLS;
      inp.value = "";
      saveSubgroupsRemote();
      renderSubgroups(id);
      switchSubgroup(id);
    }
    $("new-sub-add").onclick = createSubFromInput;
    $("new-sub-in").addEventListener("keydown", e => { if (e.key === "Enter") createSubFromInput() });

    // --- Almacenamiento local y Supabase ---
    function loadLocalBoard(readMeta = false) {
      if (readMeta) {
        try { const subs = localStorage.getItem(KEY + "-subs"); if (subs) unpackMeta(subs, false) } catch (e) { }
        if (subgroups.length) curSub = subgroups[0].id;
      }
      S = { notes: [], filter: "Todos" };
      let hadLocal = false;
      try { const r = localStorage.getItem(KEY + "-" + curSub); if (r) { S = JSON.parse(r); hadLocal = true; if (S.filter === "Todas") S.filter = "Todos" } } catch (e) { }
      if (!hadLocal && !S.notes.length && curSub === "principal") {
        S.notes = [];
      }
      ensureColumnTitles(false);
      S.notes.forEach(n => { if (n.cat) n.color = getCatColor(n.cat, n.color) });
    }
    function save(boardId = curSub, stateObj = S) { try { localStorage.setItem(KEY + "-" + boardId, JSON.stringify(stateObj)) } catch (e) { } }

    async function pushNote(n, delay = 0, boardOverride) {
      const targetBoard = boardOverride || curSub;
      if (targetBoard === curSub) save(targetBoard, S);
      const wName = (n.who || "").trim();
      const stVal = n.st === "titulo" ? "titulo" : "";
      if (wName) allNotesWho[n.id] = wName; else delete allNotesWho[n.id];
      allNotesMeta[n.id] = { board: targetBoard, who: wName, st: stVal };
      if (subFilterMine) renderSubgroups();
      if (!sb) return;
      const row = { id: n.id, board: targetBoard, t: n.t || "", cat: n.cat || "", who: n.who || "", st: stVal, link: n.link || "", body: n.body || "", color: n.color || COLORS[0], x: Math.round(n.x || 0), y: Math.round(n.y || 0), updated_at: new Date().toISOString() };
      pendingRows[n.id] = row;
      clearTimeout(saveTimers[n.id]);
      saveTimers[n.id] = setTimeout(async () => {
        delete saveTimers[n.id];
        const rToSend = pendingRows[n.id] || row;
        delete pendingRows[n.id];
        const { error } = await sb.from("notes").upsert(rToSend);
        if (error) setStatus("err", "Error al guardar en nube");
      }, delay);
    }
    async function deleteNotesRemote(ids) {
      save(curSub, S);
      ids.forEach(id => { clearTimeout(saveTimers[id]); delete saveTimers[id]; delete pendingRows[id]; delete allNotesWho[id]; delete allNotesMeta[id] });
      if (subFilterMine) renderSubgroups();
      if (!sb || !ids.length) return;
      const { error } = await sb.from("notes").delete().in("id", ids);
      if (error) setStatus("err", "Error al borrar en nube");
    }

    async function fetchSubgroupNotes(targetSub) {
      if (!sb) return;
      const reqId = ++cloudReqId;
      try {
        const { data, error } = await sb.from("notes").select("*").eq("board", targetSub).order("id", { ascending: true });
        if (error) throw error;
        if (reqId !== cloudReqId || curSub !== targetSub) return;
        Object.keys(allNotesMeta).forEach(k => { if (allNotesMeta[k]?.board === targetSub) delete allNotesMeta[k] });
        S.notes = (data || []).map(r => {
          const nid = Number(r.id), w = (r.who || "").trim(), stVal = r.st === "titulo" ? "titulo" : "";
          if (w) allNotesWho[nid] = w; else delete allNotesWho[nid];
          allNotesMeta[nid] = { board: targetSub, who: w, st: stVal };
          return { id: nid, t: r.t, cat: r.cat, who: r.who, st: stVal, link: r.link, body: r.body, color: r.cat ? getCatColor(r.cat, r.color) : r.color, x: r.x, y: r.y };
        });
        ensureColumnTitles(true);
        save(targetSub, S);
        render();
        if (subFilterMine) renderSubgroups();
        if (sel && S.notes.some(n => n.id === sel)) select(sel, false);
      } catch (err) {
        console.error(err);
      }
    }

    async function initCloud() {
      const cfg = getCfg();
      if (!cfg.url || !cfg.key || !window.supabase) {
        setStatus("", "Modo local (Conectar nube)");
        return;
      }
      try {
        setStatus("wait", "Conectando…");
        if (channel && sb) { await sb.removeChannel(channel); channel = null }
        if (!sb) sb = window.supabase.createClient(cfg.url.trim(), cfg.key.trim());

        const { data: metaData } = await sb.from("notes").select("body").eq("id", META_ID).maybeSingle();
        if (metaData && metaData.body) {
          unpackMeta(metaData.body, true);
          if (!initialSubPicked && subgroups.length) {
            curSub = subgroups[0].id;
            loadLocalBoard(false);
          }
          renderSubgroups();
        } else {
          await saveSubgroupsRemote();
        }

        // Cargar todos los responsables y subgrupos de todas las notas
        const { data: allWhoRows } = await sb.from("notes").select("id,board,who,st").neq("id", META_ID);
        if (Array.isArray(allWhoRows)) {
          allNotesWho = {};
          allNotesMeta = {};
          allWhoRows.forEach(r => {
            const nid = Number(r.id), w = (r.who || "").trim(), stVal = r.st === "titulo" ? "titulo" : "";
            if (w) allNotesWho[nid] = w;
            allNotesMeta[nid] = { board: r.board, who: w, st: stVal };
          });
        }
        renderUserBar();
        if (subFilterMine) renderSubgroups();

        await fetchSubgroupNotes(curSub);

        channel = sb.channel("room-global", { config: { broadcast: { self: false } } })
          .on("postgres_changes", { event: "*", schema: "public", table: "notes" }, payload => {
            const r = payload.new || payload.old;
            if (r && Number(r.id) === META_ID && payload.new?.body) {
              unpackMeta(payload.new.body, true);
              S.notes.forEach(n => { if (n.cat && catColors[n.cat]) n.color = catColors[n.cat] });
              renderSubgroups(); renderUserBar(); render(); if (sel) syncPanelFromNote(cur());
              if ($("rank-pop").classList.contains("open")) renderRankingPop();
              return;
            }
            if (payload.eventType === "DELETE") {
              const delId = Number(payload.old.id);
              delete allNotesWho[delId];
              delete allNotesMeta[delId];
              if (S.notes.some(n => n.id === delId)) {
                S.notes = S.notes.filter(n => n.id !== delId);
                selSet.delete(delId);
                if (sel === delId) { sel = null; $("panel").classList.remove("open") }
                save(curSub, S); render();
              }
              if (subFilterMine) renderSubgroups();
            } else if (payload.new) {
              const nr = payload.new;
              const nid = Number(nr.id), w = (nr.who || "").trim(), stVal = nr.st === "titulo" ? "titulo" : "";
              if (w) allNotesWho[nid] = w; else delete allNotesWho[nid];
              allNotesMeta[nid] = { board: nr.board, who: w, st: stVal };
              if (nr.board === curSub) {
                const incoming = { id: nid, t: nr.t, cat: nr.cat, who: nr.who, st: stVal, link: nr.link, body: nr.body, color: nr.cat ? getCatColor(nr.cat, nr.color) : nr.color, x: nr.x, y: nr.y };
                const idx = S.notes.findIndex(n => n.id === incoming.id);
                if (idx >= 0) S.notes[idx] = incoming; else S.notes.push(incoming);
                save(curSub, S); render();
                if (sel === incoming.id) syncPanelFromNote(incoming);
              }
              renderUserBar();
              if (subFilterMine) renderSubgroups();
            }
          })
          .on("broadcast", { event: "presence_ping" }, ({ payload }) => {
            touchPeerPresence(payload);
          })
          .on("broadcast", { event: "cursor" }, ({ payload }) => {
            if (!payload || payload.id === myId || payload.devId === myDevId) return;
            touchPeerPresence(payload);
            if (payload.sub !== curSub) {
              if (peers[payload.id]) { peers[payload.id].el.remove(); delete peers[payload.id] }
              return;
            }
            renderPeerCursor(payload);
          })
          .subscribe(status => {
            if (status === "SUBSCRIBED") {
              const curObj = subgroups.find(s => s.id === curSub);
              setStatus("ok", `En vivo · ${curObj ? curObj.name : curSub}`);
              sendPresencePing();
              if (presenceInterval) clearInterval(presenceInterval);
              presenceInterval = setInterval(() => sendPresencePing(), 3000);
            }
          });
      } catch (err) {
        console.error(err);
        const msg = (err && err.message || "").toLowerCase();
        if (err && err.code === "PGRST205" || err && err.code === "42P01" || msg.includes("notes")) setStatus("err", "Falta correr el SQL en Supabase");
        else setStatus("err", "Error de conexión");
      }
    }

    // --- Cursores en vivo ---
    function renderPeerCursor(p) {
      let peer = peers[p.id];
      if (!peer) {
        const el = document.createElement("div");
        el.className = "peer-cursor";
        el.innerHTML = `<svg viewBox="0 0 24 24"><path fill="${p.color || "#3b5bdb"}" stroke="#fff" stroke-width="1.8" d="M4 2l16 10-7 2-3 7z"/></svg><span class="peer-tag" style="background:${p.color || "#3b5bdb"}"></span>`;
        $("board").appendChild(el);
        peer = peers[p.id] = { el, timer: null };
      }
      peer.el.querySelector(".peer-tag").textContent = p.name || "Compañero/a";
      peer.el.style.transform = `translate(${p.x}px,${p.y}px)`;
      clearTimeout(peer.timer);
      peer.timer = setTimeout(() => { peer.el.remove(); delete peers[p.id] }, 10000);
    }
    $("scroll").addEventListener("pointermove", e => {
      if (!channel) return;
      const now = performance.now();
      if (now - lastCursorSent < 55) return;
      lastCursorSent = now;
      const rect = $("scroll").getBoundingClientRect();
      const wx = Math.round((e.clientX - rect.left - cam.x) / cam.z);
      const wy = Math.round((e.clientY - rect.top - cam.y) / cam.z);
      channel.send({
        type: "broadcast", event: "cursor", payload: {
          id: myId, devId: myDevId, name: curUser || "Invitado/a", color: myColor, x: wx, y: wy, sub: curSub
        }
      });
    });

    function href(u) { return /^https?:\/\//i.test(u) ? u : "https://" + u }
    function visibleNotes() {
      const q = qStr.trim().toLowerCase();
      return S.notes.filter(n => {
        if (n.st === "titulo") return true; // Los títulos de columna siempre permanecen visibles hasta arriba
        if (S.filter !== "Todos") {
          const w = (n.who || "").trim();
          if (S.filter === "Sin asignar") {
            if (w) return false;
          } else if (w !== S.filter) {
            return false;
          }
        }
        if (!q) return true;
        return [n.t, n.cat, n.who, n.body].some(v => (v || "").toLowerCase().includes(q));
      });
    }

    // --- Renderizado del Tablero por Columnas y Auto-apilado ---
    function layoutColumns(pushChanged = false) {
      const b = $("board");
      const numCols = getNumCols();
      b.querySelectorAll(".col-lane,.col-add-note,.add-col-btn").forEach(el => el.remove());

      for (let c = 0; c < numCols; c++) {
        const cx = colX(c);
        const lane = document.createElement("div");
        lane.className = "col-lane";
        lane.dataset.col = c;
        lane.style.left = (cx - 8) + "px";
        lane.style.top = (COL_Y0 - 8) + "px";
        b.appendChild(lane);

        // Posicionar el post-it de título de esta columna hasta arriba
        const tNote = S.notes.find(n => n.st === "titulo" && xToCol(n.x, numCols) === c);
        let curY = COL_Y0 + 78 + 16;
        if (tNote) {
          const changed = tNote.x !== cx || tNote.y !== COL_Y0;
          tNote.x = cx;
          tNote.y = COL_Y0;
          const tEl = b.querySelector(`.note[data-id="${tNote.id}"]`);
          if (tEl) {
            if (!tEl.classList.contains("grabbed")) {
              tEl.style.left = cx + "px";
              tEl.style.top = COL_Y0 + "px";
            }
            curY = COL_Y0 + (tEl.offsetHeight || 78) + 16;
          }
          if (pushChanged && changed) pushNote(tNote, 30);
        }

        // Apilar automáticamente las notas de esta columna una debajo de otra
        const colNotes = visibleNotes()
          .filter(n => n.st !== "titulo" && xToCol(n.x, numCols) === c)
          .sort((a, b2) => (a.y - b2.y) || (a.id - b2.id));

        colNotes.forEach(n => {
          const el = b.querySelector(`.note[data-id="${n.id}"]`);
          const changed = n.x !== cx || n.y !== curY;
          n.x = cx;
          n.y = curY;
          if (el) {
            if (!el.classList.contains("grabbed")) {
              el.style.left = cx + "px";
              el.style.top = curY + "px";
            }
            curY += (el.offsetHeight || NOTE_H) + 14;
          } else {
            curY += NOTE_H + 14;
          }
          if (pushChanged && changed) pushNote(n, 30);
        });

        lane.style.height = Math.max(380, curY - COL_Y0 + 58) + "px";

        // Botón "+ Añadir nota" al final de cada columna
        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.className = "col-add-note";
        addBtn.textContent = "+ Añadir nota";
        addBtn.style.left = cx + "px";
        addBtn.style.top = (curY + 2) + "px";
        addBtn.onpointerdown = ev => ev.stopPropagation();
        addBtn.onclick = ev => {
          ev.stopPropagation();
          addNoteInCol(c);
        };
        b.appendChild(addBtn);
      }

      // Botón "+" a la derecha de la última columna para agregar una nueva columna
      const newColBtn = document.createElement("button");
      newColBtn.type = "button";
      newColBtn.className = "add-col-btn";
      newColBtn.textContent = "+";
      newColBtn.title = "Agregar nueva columna";
      newColBtn.style.left = colX(numCols) + "px";
      newColBtn.style.top = COL_Y0 + "px";
      newColBtn.onpointerdown = ev => ev.stopPropagation();
      newColBtn.onclick = ev => {
        ev.stopPropagation();
        recordUndo();
        playSfx("spawn");
        const nextC = getNumCols();
        subCols[curSub] = nextC + 1;
        ensureColumnTitles(true);
        saveSubgroupsRemote();
        render();
        const newTitle = S.notes.find(n => n.st === "titulo" && xToCol(n.x, subCols[curSub]) === nextC);
        if (newTitle) {
          select(newTitle.id, false);
          $("f-t").focus(); $("f-t").select();
          spawnDust(newTitle.x, newTitle.y, NOTE_W, 78);
        }
      };
      b.appendChild(newColBtn);
    }

    function render() {
      ensureColumnTitles(false);
      const b = $("board");
      b.querySelectorAll(".note").forEach(el => el.remove());
      visibleNotes().forEach(n => {
        const isSelected = selSet.has(n.id) || n.id === sel;
        const isTitle = n.st === "titulo";
        const noteColor = normalizeColor(n.cat ? getCatColor(n.cat, n.color) : (n.color || COLORS[0]));
        n.color = noteColor;
        const d = document.createElement("div");
        d.className = "note" + (isTitle ? " is-title" : "") + (isSelected ? " sel" : "");
        d.dataset.id = n.id;
        d.style.left = n.x + "px";
        d.style.top = n.y + "px";
        applyCardTheme(d, noteColor);
        const t = document.createElement("b"); t.textContent = n.t || "Sin título"; d.appendChild(t);

        if (!isTitle) {
          const { checks, text } = parseBody(n.body);
          if (text) {
            const bd = document.createElement("div"); bd.className = "note-body"; bd.textContent = text; d.appendChild(bd);
          }
          if (checks.length) {
            const cw = document.createElement("div"); cw.className = "note-checks";
            checks.forEach((c, idx) => {
              const row = document.createElement("label"); row.className = "chk-row" + (c.done ? " done" : "");
              row.onpointerdown = ev => ev.stopPropagation();
              const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = c.done;
              cb.onchange = () => {
                recordUndo();
                checks[idx].done = cb.checked;
                playSfx(cb.checked ? "check" : "drop");
                n.body = serializeBody(checks, text);
                pushNote(n, 50); render();
                if (sel === n.id) syncPanelFromNote(n);
              };
              const sp = document.createElement("span"); sp.textContent = c.text;
              row.append(cb, sp); cw.appendChild(row);
            });
            d.appendChild(cw);
          }

          if (n.link && n.link.trim()) {
            const a = document.createElement("a");
            a.className = "drive-btn"; a.href = href(n.link.trim()); a.target = "_blank"; a.rel = "noopener";
            a.innerHTML = `${DRIVE_SVG}<span>Google Drive</span>`;
            a.onpointerdown = ev => ev.stopPropagation();
            d.appendChild(a);
          }

          const tags = document.createElement("div"); tags.className = "tags";
          if (n.cat) { const c = document.createElement("span"); c.className = "tag"; c.textContent = n.cat; tags.appendChild(c) }
          if (checks.length) {
            const doneCnt = checks.filter(c => c.done).length;
            const cs = document.createElement("span"); cs.className = "tag"; cs.textContent = `✓ ${doneCnt}/${checks.length}`; tags.appendChild(cs);
          }
          if (tags.childNodes.length) d.appendChild(tags);

          const m = document.createElement("div"); m.className = "meta";
          const whoTxt = document.createElement("span");
          const wName = (n.who || "").trim();
          whoTxt.textContent = wName || "Sin asignar";
          m.appendChild(whoTxt);
          if (wName) {
            const av = document.createElement("span");
            av.className = "note-av";
            av.title = wName;
            fillAvatarEl(av, wName, "👤");
            m.appendChild(av);
          }
          d.appendChild(m);

          // Botones + en circulito arriba y abajo en las notas de cada columna
          ["top", "bot"].forEach(pos => {
            const qb = document.createElement("button");
            qb.type = "button";
            qb.className = "q-dup " + pos;
            qb.textContent = "+";
            qb.title = pos === "top" ? "Duplicar nota arriba" : "Duplicar nota abajo";
            qb.onpointerdown = ev => ev.stopPropagation();
            qb.onclick = ev => {
              ev.stopPropagation();
              recordUndo();
              playSfx("spawn");
              const ny = pos === "top" ? n.y - 5 : n.y + 5;
              const copy = { ...JSON.parse(JSON.stringify(n)), id: Date.now(), x: n.x, y: ny };
              S.notes.push(copy);
              selSet.clear(); selSet.add(copy.id);
              render();
              layoutColumns(true);
              pushNote(copy, 0);
              select(copy.id, false);
              const cEl = document.querySelector(`.note[data-id="${copy.id}"]`);
              spawnDust(copy.x, copy.y, NOTE_W, cEl ? cEl.offsetHeight : NOTE_H);
            };
            d.appendChild(qb);
          });
        }

        d.addEventListener("pointerdown", e => dragNote(e, n, d));
        b.appendChild(d);
      });
      layoutColumns(false);
      chips(); lists();
    }
    function chips() {
      const whos = [...new Set(S.notes.map(n => (n.who || "").trim()).filter(Boolean))];
      const hasUnassigned = S.notes.some(n => n.st !== "titulo" && !(n.who || "").trim());
      const cs = ["Todos", ...whos, ...(hasUnassigned ? ["Sin asignar"] : [])];
      if (!cs.includes(S.filter)) S.filter = "Todos";
      const w = $("chips"); w.textContent = "";
      cs.forEach(c => {
        const x = document.createElement("button"); x.className = "chip" + (c === S.filter ? " on" : "");
        if (c === "Todos") {
          x.textContent = "👥 Todos";
        } else if (c === "Sin asignar") {
          x.textContent = "Sin asignar";
        } else {
          const av = document.createElement("span");
          av.className = "chip-av";
          fillAvatarEl(av, c, "👤");
          const sp = document.createElement("span");
          sp.textContent = c;
          x.append(av, sp);
        }
        x.onclick = () => { S.filter = c; render() };
        w.appendChild(x);
      });
    }
    function lists() {
      $("cats").innerHTML = [...new Set([...Object.keys(catColors), ...S.notes.map(n => n.cat).filter(Boolean)])].map(c => `<option value="${c.replace(/"/g, "&quot;")}">`).join("");
      $("whos").innerHTML = [...new Set(S.notes.map(n => n.who).filter(Boolean))].map(c => `<option value="${c.replace(/"/g, "&quot;")}">`).join("")
    }

    // --- Sintetizador de Sonidos estilo Nintendo (Web Audio API) y Polvito Vectorial ---
    let audioCtx = null, sfxMuted = false;
    try { sfxMuted = localStorage.getItem("tablero-sfx-mute") === "1" } catch (e) { }
    function updateSfxBtn() {
      const b = $("z-sfx");
      if (b) b.textContent = sfxMuted ? "🔇" : "🔊";
    }
    updateSfxBtn();
    $("z-sfx").onclick = () => {
      sfxMuted = !sfxMuted;
      try { localStorage.setItem("tablero-sfx-mute", sfxMuted ? "1" : "0") } catch (e) { }
      updateSfxBtn();
      if (!sfxMuted) playSfx("pickup");
    };

    function playSfx(kind) {
      if (sfxMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (kind === "pickup") {
          // "Pop" agudo y redondito hacia arriba al levantar la tarjeta
          osc.type = "sine";
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(590, now + 0.068);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (kind === "drop") {
          // "Plop / Thump" cálido al soltar la tarjeta en el tablero
          osc.type = "triangle";
          osc.frequency.setValueAtTime(310, now);
          osc.frequency.exponentialRampToValueAtTime(115, now + 0.085);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (kind === "spawn") {
          // Burbuja / Pop doble al crear o duplicar nota
          osc.type = "sine";
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.085);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.17, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.095);
        } else if (kind === "check") {
          // Ding alegre estilo Nintendo al completar subtarea
          osc.type = "triangle";
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.055); // A5
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.16, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.19);
        }
      } catch (e) { }
    }

    function spawnDust(x, y, w, h) {
      const b = $("board");
      const puffs = [
        // Esquina y borde inferior izquierdo
        { sx: x + 12, sy: y + h - 4, dx: -34, dy: 14, sz: 18 },
        { sx: x + 4, sy: y + h - 18, dx: -28, dy: -6, sz: 13 },
        // Centro inferior
        { sx: x + w * 0.35, sy: y + h, dx: -12, dy: 24, sz: 15 },
        { sx: x + w * 0.65, sy: y + h, dx: 14, dy: 22, sz: 16 },
        // Esquina y borde inferior derecho
        { sx: x + w - 12, sy: y + h - 4, dx: 36, dy: 14, sz: 19 },
        { sx: x + w - 4, sy: y + h - 18, dx: 28, dy: -6, sz: 13 },
        // Costados superiores
        { sx: x + 6, sy: y + 18, dx: -24, dy: -14, sz: 12 },
        { sx: x + w - 6, sy: y + 18, dx: 24, dy: -14, sz: 12 }
      ];
      puffs.forEach(p => {
        const el = document.createElement("div");
        el.className = "dust-puff";
        const jx = (Math.random() - 0.5) * 8, jy = (Math.random() - 0.5) * 8;
        el.style.width = p.sz + "px";
        el.style.height = p.sz + "px";
        el.style.left = p.sx + "px";
        el.style.top = p.sy + "px";
        el.style.setProperty("--dx", Math.round(p.dx + jx) + "px");
        el.style.setProperty("--dy", Math.round(p.dy + jy) + "px");
        b.appendChild(el);
        setTimeout(() => el.remove(), 440);
      });
    }

    // --- Arrastre a Columnas con Auto-acomodo, Físicas de Tambaleo y Polvito ---
    function dragNote(e, n, d) {
      if (e.button === 1 || spaceDown || handMode) return;
      if (e.button !== 0) return;
      e.stopPropagation();

      if (e.shiftKey && n.st !== "titulo") {
        if (selSet.has(n.id)) selSet.delete(n.id); else selSet.add(n.id);
        sel = n.id;
        updateSelectionUI();
        playSfx("pickup");
        return;
      }
      if (!selSet.has(n.id) || n.st === "titulo") {
        selSet.clear(); selSet.add(n.id);
      }
      sel = n.id;
      updateSelectionUI();

      const isTitleDrag = n.st === "titulo";
      const numCols = getNumCols();
      const startCol = xToCol(n.x, numCols);
      const movingNotes = isTitleDrag ? [n] : S.notes.filter(x => selSet.has(x.id) && x.st !== "titulo");
      const movingEls = movingNotes.map(mn => ({ mn, el: document.querySelector(`.note[data-id="${mn.id}"]`) })).filter(x => x.el);
      const origPos = new Map(movingNotes.map(x => [x.id, { x: x.x, y: x.y }]));
      const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
      let moved = false, lastX = e.clientX, tilt = 0;
      let hoverCol = startCol, insertSortY = n.y;

      playSfx("pickup");
      movingEls.forEach(({ el }) => {
        el.classList.remove("landed");
        el.classList.add("grabbed", "wobble-start");
        setTimeout(() => el.classList.remove("wobble-start"), 330);
      });

      d.setPointerCapture(e.pointerId); d.style.cursor = "grabbing";
      const dropSlot = $("drop-slot");

      const mv = ev => {
        const dx = (ev.clientX - sx) / cam.z, dy = (ev.clientY - sy) / cam.z;
        if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4) {
          recordUndo();
          moved = true;
        }
        const vx = ev.clientX - lastX;
        lastX = ev.clientX;
        const targetTilt = Math.max(-13, Math.min(13, vx * 0.65));
        tilt = tilt * 0.65 + targetTilt * 0.35;

        const targetX = Math.round(ox + dx), targetY = Math.round(oy + dy);
        hoverCol = xToCol(targetX, numCols);

        // Resaltar la columna destino
        document.querySelectorAll(".col-lane").forEach(ln => {
          ln.classList.toggle("active-col", +ln.dataset.col === hoverCol);
        });

        if (!isTitleDrag && moved) {
          // Calcular en qué hueco vertical de la columna destino caerá la nota
          const colPeers = visibleNotes()
            .filter(x => x.st !== "titulo" && !selSet.has(x.id) && xToCol(x.x, numCols) === hoverCol)
            .sort((a, b2) => (a.y - b2.y) || (a.id - b2.id));

          const tNote = S.notes.find(x => x.st === "titulo" && xToCol(x.x, numCols) === hoverCol);
          const tEl = tNote ? document.querySelector(`.note[data-id="${tNote.id}"]`) : null;
          const topBase = COL_Y0 + (tEl ? tEl.offsetHeight : 78) + 16;

          let slotY = topBase - 8;
          insertSortY = topBase - 20;

          for (let i = 0; i < colPeers.length; i++) {
            const p = colPeers[i];
            const pEl = document.querySelector(`.note[data-id="${p.id}"]`);
            const pH = pEl ? pEl.offsetHeight : NOTE_H;
            const midY = p.y + pH / 2;
            if (targetY + 30 > midY) {
              slotY = p.y + pH + 4;
              const nextP = colPeers[i + 1];
              insertSortY = nextP ? (p.y + nextP.y) / 2 : p.y + pH + 50;
            }
          }
          dropSlot.style.left = colX(hoverCol) + "px";
          dropSlot.style.top = slotY + "px";
          dropSlot.style.display = "block";
        }

        movingEls.forEach(({ mn, el }) => {
          const op = origPos.get(mn.id);
          mn.x = op.x + (targetX - ox);
          mn.y = isTitleDrag ? COL_Y0 : op.y + (targetY - oy);
          el.style.left = mn.x + "px";
          el.style.top = mn.y + "px";
          el.style.setProperty("--tilt", tilt.toFixed(2) + "deg");
        });
      };

      const up = () => {
        d.removeEventListener("pointermove", mv); d.removeEventListener("pointerup", up);
        d.style.cursor = "";
        dropSlot.style.display = "none";
        document.querySelectorAll(".col-lane.active-col").forEach(ln => ln.classList.remove("active-col"));

        movingEls.forEach(({ el }) => {
          el.classList.remove("grabbed", "wobble-start");
          el.style.setProperty("--tilt", "0deg");
        });

        if (moved) {
          if (isTitleDrag) {
            // Si arrastramos el Título de una columna a otra, intercambiamos ambas columnas completas
            if (hoverCol !== startCol) {
              const colANotes = S.notes.filter(x => x.id === n.id || (x.st !== "titulo" && xToCol(x.x, numCols) === startCol));
              const colBNotes = S.notes.filter(x => x.id !== n.id && xToCol(x.x, numCols) === hoverCol);
              colANotes.forEach(x => { x.x = colX(hoverCol); pushNote(x, 20) });
              colBNotes.forEach(x => { x.x = colX(startCol); pushNote(x, 20) });
            } else {
              n.x = colX(startCol); n.y = COL_Y0;
            }
          } else {
            // Acomodar las notas arrastradas en su lugar dentro de la columna destino
            const sortedMoving = [...movingNotes].sort((a, b2) => (origPos.get(a.id).y - origPos.get(b2.id).y));
            sortedMoving.forEach((mn, idx) => {
              mn.x = colX(hoverCol);
              mn.y = insertSortY + idx * 0.5;
            });
          }
          layoutColumns(true);
          movingNotes.forEach(mn => pushNote(mn, 20));
          playSfx("drop");
          movingEls.forEach(({ mn, el }) => {
            el.classList.add("landed");
            setTimeout(() => el.classList.remove("landed"), 300);
            const h = el.offsetHeight || (mn.st === "titulo" ? 78 : NOTE_H);
            spawnDust(mn.x, mn.y, NOTE_W, h);
          });
        } else {
          playSfx("drop");
          select(n.id, false);
        }
      };
      d.addEventListener("pointermove", mv); d.addEventListener("pointerup", up);
    }

    function cur() { return S.notes.find(n => n.id === sel) }
    function updateSelectionUI() {
      document.querySelectorAll(".note").forEach(el => {
        const id = +el.dataset.id;
        el.classList.toggle("sel", selSet.has(id) || id === sel);
      });
      const mb = $("multi-badge");
      if (selSet.size > 1) {
        mb.style.display = "block";
        mb.textContent = `${selSet.size} notas seleccionadas`;
      } else mb.style.display = "none";
    }
    function positionPanelNextToNote(id, triggerPop = true) {
      const p = $("panel");
      const el = document.querySelector(`.note[data-id="${id}"]`);
      if (!el) return;
      const r = el.getBoundingClientRect();
      const pw = p.offsetWidth || 318;
      const ph = p.offsetHeight || 420;
      const gap = 14;
      let left = r.right + gap;
      // Si no cabe a la derecha del post-it, abrirlo a su izquierda
      if (left + pw > window.innerWidth - 12) {
        left = r.left - pw - gap;
      }
      // Limitar dentro de la pantalla (respetando la barra lateral de subgrupos si es posible)
      const minX = 12;
      const maxX = Math.max(minX, window.innerWidth - pw - 12);
      left = Math.max(minX, Math.min(maxX, left));

      let top = r.top - 6;
      const minY = 58;
      const maxY = Math.max(minY, window.innerHeight - ph - 12);
      top = Math.max(minY, Math.min(maxY, top));

      p.style.left = Math.round(left) + "px";
      p.style.top = Math.round(top) + "px";

      if (triggerPop) {
        p.classList.remove("pop-anim");
        void p.offsetWidth;
        p.classList.add("pop-anim");
      }
    }

    function select(id, smoothZoom = false) {
      sel = id;
      if (!selSet.has(id)) { selSet.clear(); selSet.add(id) }
      updateSelectionUI();
      const n = cur(); if (!n) return;
      $("panel").classList.add("open");
      syncPanelFromNote(n);
      positionPanelNextToNote(id, true);
      if (smoothZoom) focusNoteSmooth(n);
    }

    function syncPanelFromNote(n) {
      if (!n) return;
      const isTitle = n.st === "titulo";
      $("title-badge").style.display = isTitle ? "block" : "none";
      $("normal-fields").style.display = isTitle ? "none" : "flex";
      $("lbl-who").style.display = isTitle ? "none" : "flex";
      $("dup").style.display = isTitle ? "none" : "";
      $("del").textContent = isTitle ? "Borrar columna" : "Borrar";

      const active = document.activeElement;
      const { checks, text } = parseBody(n.body);
      if (active !== $("f-t")) $("f-t").value = n.t;
      if (active !== $("f-cat")) $("f-cat").value = n.cat;
      if (active !== $("f-who")) $("f-who").value = n.who;
      if (active !== $("f-link")) $("f-link").value = n.link;
      if (active !== $("f-body")) $("f-body").value = text;

    // --- Arrastrar el panel flotante como si fuera un post-it ---
    $("panel").addEventListener("pointerdown", e => {
      if (e.button !== 0) return;

      const p = $("panel");
      const r = p.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      const ox = r.left, oy = r.top;
      let lastX = e.clientX, tilt = 0, moved = false;
      p.setPointerCapture(e.pointerId);
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) > 3) {
          moved = true;
          p.classList.remove("pop-anim");
          p.classList.add("dragging-panel");
          playSfx("pickup");
        }
        if (!moved) return;
        const vx = ev.clientX - lastX;
        lastX = ev.clientX;
        tilt = tilt * 0.65 + Math.max(-7, Math.min(7, vx * 0.35)) * 0.35;
        p.style.setProperty("--ptilt", tilt.toFixed(2) + "deg");
        const pw = p.offsetWidth || 318, ph = p.offsetHeight || 400;
        const nx = Math.max(8, Math.min(window.innerWidth - pw - 8, ox + dx));
        const ny = Math.max(52, Math.min(window.innerHeight - 60, oy + dy));
        p.style.left = Math.round(nx) + "px";
        p.style.top = Math.round(ny) + "px";
      };
      const up = () => {
        p.removeEventListener("pointermove", mv);
        p.removeEventListener("pointerup", up);
        if (moved) {
          p.classList.remove("dragging-panel");
          p.style.setProperty("--ptilt", "0deg");
          playSfx("drop");
        }
      };
      p.addEventListener("pointermove", mv);
      p.addEventListener("pointerup", up);
    });

    // --- Modo Manita (desplazamiento para laptop/trackpad) + Navegación táctil iOS/Android sin atascos ---
    let handMode = false;
    function setHandMode(on) {
      handMode = !!on;
      const b = $("z-hand");
      if (b) b.classList.toggle("on", handMode);
      $("scroll").classList.toggle("space-ready", handMode || spaceDown);

    // Navegación táctil nativa (iPhone / Android): 1 dedo en el fondo mueve, 2 dedos en cualquier lado hacen pinch-zoom + pan
    let tMode = null, tStartX = 0, tStartY = 0, tCamX = 0, tCamY = 0, tMoved = false;
    let tPinchDist = 0, tPinchZ = 1, tPinchMid = null;
    const scEl = $("scroll");

    scEl.addEventListener("touchstart", e => {
      if (e.target.closest(".hud") || e.target.closest(".trophy-btn")) return;
      const rect = scEl.getBoundingClientRect();
      if (e.touches.length === 2) {
        e.preventDefault();
        if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null }
        const a = e.touches[0], b = e.touches[1];
        tMode = "pinch";
        tMoved = true;
        tPinchDist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY) || 1;
        tPinchZ = cam.z;
        tPinchMid = { x: (a.clientX + b.clientX) / 2 - rect.left, y: (a.clientY + b.clientY) / 2 - rect.top };
        tCamX = cam.x;
        tCamY = cam.y;
        return;
      }
      if (e.touches.length === 1 && (handMode || e.target.id === "scroll" || e.target.id === "board")) {
        if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null }
        tMode = "pan";
        tMoved = false;
        tStartX = e.touches[0].clientX;
        tStartY = e.touches[0].clientY;
        tCamX = cam.x;
        tCamY = cam.y;
      }
    }, { passive: false });

    scEl.addEventListener("touchmove", e => {
      if (!tMode) return;
      const rect = scEl.getBoundingClientRect();
      if (e.touches.length === 2) {
        e.preventDefault();
        const a = e.touches[0], b = e.touches[1];
        const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY) || 1;
        const mid = { x: (a.clientX + b.clientX) / 2 - rect.left, y: (a.clientY + b.clientY) / 2 - rect.top };
        if (tMode !== "pinch" || !tPinchMid) {
          tMode = "pinch";
          tPinchDist = dist;
          tPinchZ = cam.z;
          tPinchMid = mid;
          tCamX = cam.x;
          tCamY = cam.y;
          return;
        }
        tMoved = true;
        const newZ = Math.min(MAX_Z, Math.max(MIN_Z, tPinchZ * (dist / tPinchDist)));
        const wx = (tPinchMid.x - tCamX) / tPinchZ;
        const wy = (tPinchMid.y - tCamY) / tPinchZ;
        cam.z = newZ;
        cam.x = mid.x - wx * newZ;
        cam.y = mid.y - wy * newZ;
        applyCam();
        return;
      }
      if (e.touches.length === 1 && tMode === "pan") {
        const dx = e.touches[0].clientX - tStartX;
        const dy = e.touches[0].clientY - tStartY;
        if (Math.abs(dx) + Math.abs(dy) > 4) tMoved = true;
        if (tMoved) {
          e.preventDefault();
          cam.x = tCamX + dx;
          cam.y = tCamY + dy;
          applyCam();
        }
      }
    }, { passive: false });

    function endTouchNav(e) {
      if (e.touches.length === 1 && tMode === "pinch") {
        tMode = "pan";
        tMoved = true;
        tStartX = e.touches[0].clientX;
        tStartY = e.touches[0].clientY;
        tCamX = cam.x;
        tCamY = cam.y;
        tPinchMid = null;
        return;
      }
      if (e.touches.length === 0) {
        const wasTap = tMode === "pan" && !tMoved;
        tMode = null;
        tPinchMid = null;
        if (wasTap && (e.target.id === "scroll" || e.target.id === "board")) $("close").click();
      }
    }
    scEl.addEventListener("touchend", endTouchNav);
    scEl.addEventListener("touchcancel", () => { tMode = null; tPinchMid = null });

    $("scroll").addEventListener("pointerdown", e => {
      if (e.pointerType === "touch") return;
      if (e.target.closest(".hud") || e.target.closest(".trophy-btn")) return;
      const sc = $("scroll"), rect = sc.getBoundingClientRect();

      // Pan con botón central (rueda), Espacio + Clic izquierdo o Modo Manita activo
      if (e.button === 1 || (e.button === 0 && (spaceDown || handMode))) {
        if (e.button === 1) e.preventDefault();
        if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null }
        const sx = e.clientX, sy = e.clientY, ox = cam.x, oy = cam.y;
        sc.classList.add("panning");
        sc.setPointerCapture(e.pointerId);
        const mv = ev => {
          cam.x = ox + (ev.clientX - sx); cam.y = oy + (ev.clientY - sy); applyCam();
        };
        const up = () => {
          sc.removeEventListener("pointermove", mv); sc.removeEventListener("pointerup", up);
          sc.classList.remove("panning");
        };
        sc.addEventListener("pointermove", mv); sc.addEventListener("pointerup", up);
        return;
      }

      // Modo Selección por defecto al arrastrar con clic izquierdo sobre el lienzo vacío (escritorio)
      if (e.button === 0 && (e.target.id === "scroll" || e.target.id === "board")) {
        const mq = $("marquee"), sx = e.clientX - rect.left, sy = e.clientY - rect.top;
        let moved = false;
        sc.setPointerCapture(e.pointerId);
        const mv = ev => {
          const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
          const w = Math.abs(cx - sx), h = Math.abs(cy - sy);
          if (w + h > 4) {
            moved = true;
            mq.style.display = "block";
            const x1 = Math.min(sx, cx), y1 = Math.min(sy, cy);
            mq.style.left = x1 + "px"; mq.style.top = y1 + "px"; mq.style.width = w + "px"; mq.style.height = h + "px";
            const wx1 = (x1 - cam.x) / cam.z, wy1 = (y1 - cam.y) / cam.z, wx2 = ((x1 + w) - cam.x) / cam.z, wy2 = ((y1 + h) - cam.y) / cam.z;
            selSet.clear(); sel = null;
            visibleNotes().filter(n => n.st !== "titulo").forEach(n => {
              if (n.x + NOTE_W >= wx1 && n.x <= wx2 && n.y + NOTE_H >= wy1 && n.y <= wy2) { selSet.add(n.id); sel = n.id }
            });
            updateSelectionUI();
          }
        };
        const up = () => {
          sc.removeEventListener("pointermove", mv); sc.removeEventListener("pointerup", up);
          mq.style.display = "none";
          if (!moved) {
            $("close").click();
          } else if (sel) {
            $("panel").classList.add("open"); syncPanelFromNote(cur()); positionPanelNextToNote(sel, true);
          }
        };
        sc.addEventListener("pointermove", mv); sc.addEventListener("pointerup", up);
      }
    });
    window.addEventListener("mousedown", e => { if (e.button === 1 && e.target.closest("#scroll")) e.preventDefault() });

    $("scroll").addEventListener("dblclick", e => {
      if (e.target.id !== "scroll" && e.target.id !== "board") return;
      const rect = $("scroll").getBoundingClientRect();
      const wx = (e.clientX - rect.left - cam.x) / cam.z - 110;
      addNoteInCol(xToCol(wx, getNumCols()));

    window.addEventListener("wheel", e => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const factor = Math.exp(-e.deltaY * 0.0025);
        zoomAt(cam.z * factor, e.clientX, e.clientY);
      } else if (e.target.closest("#scroll") && !e.target.closest(".hud")) {
        e.preventDefault();

        cam.x -= e.deltaX; cam.y -= e.deltaY; applyCam();
      }
    }, { passive: false });

    $("z-undo").onclick = () => undo();
    $("z-in").onclick = () => zoomAt(cam.z * 1.2);
    $("z-out").onclick = () => zoomAt(cam.z / 1.2);
    $("z-rst").onclick = () => animateCamTo(0, 0, 1, 240);
    $("z-fit").onclick = () => fitAll();

    // --- Copiar y Pegar notas (Ctrl + C / Ctrl + V, incluso entre subgrupos) ---
    let clipData = null;
    function copySelectedNotes() {
      const targets = S.notes.filter(x => (selSet.has(x.id) || x.id === sel) && x.st !== "titulo");
      if (!targets.length) return;
      clipData = { sub: curSub, count: 0, notes: cloneNotes(targets) };
      try { localStorage.setItem(KEY + "-clip", JSON.stringify(clipData)) } catch (e) { }
    }
    function pasteNotes() {
      if (!clipData) {
        try { const r = localStorage.getItem(KEY + "-clip"); if (r) clipData = JSON.parse(r) } catch (e) { }
      }
      if (!clipData || !Array.isArray(clipData.notes) || !clipData.notes.length) return;
      recordUndo();
      playSfx("spawn");
      const numCols = getNumCols();
      selSet.clear();
      const baseId = Date.now();
      clipData.notes.forEach((n, i) => {
        const c = xToCol(n.x, numCols);
        const copy = { ...cloneNotes(n), id: baseId + i, st: "", x: colX(c), y: (n.y || 200) + 10 + i };
        S.notes.push(copy);
        selSet.add(copy.id);
        sel = copy.id;
      });
      render();
      layoutColumns(true);
      S.notes.filter(x => selSet.has(x.id)).forEach(x => pushNote(x, 0));
      if (sel) { $("panel").classList.add("open"); syncPanelFromNote(cur()); positionPanelNextToNote(sel, true) }
    }

    window.addEventListener("keydown", e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
      if (e.code === "Space" && !typing) { e.preventDefault(); spaceDown = true; $("scroll").classList.add("space-ready") }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) {
        e.preventDefault();
        undo();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c" && !typing && (sel || selSet.size)) {
        e.preventDefault();
        copySelectedNotes();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v" && !typing) {
        e.preventDefault();
        pasteNotes();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === "=" || e.key === "+" || e.key === "-" || e.key === "0")) {
        e.preventDefault();
        if (e.key === "-") zoomAt(cam.z / 1.2);
        else if (e.key === "0") animateCamTo(0, 0, 1, 240);
        else zoomAt(cam.z * 1.2);
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a" && !typing) {
        e.preventDefault();
        selSet.clear(); visibleNotes().filter(n => n.st !== "titulo").forEach(n => { selSet.add(n.id); sel = n.id });
        updateSelectionUI(); if (sel) { $("panel").classList.add("open"); syncPanelFromNote(cur()); positionPanelNextToNote(sel, true) }
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d" && (sel || selSet.size)) {
        e.preventDefault(); $("dup").click(); return;
      }
      if (typing) {
        if (e.key === "Escape") document.activeElement.blur();
        return;
      }
      if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomAt(cam.z * 1.2) }
      else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomAt(cam.z / 1.2) }
      else if (e.key === "0") { animateCamTo(0, 0, 1, 240) }
      else if (e.key.toLowerCase() === "f") { fitAll() }
      else if (e.key.toLowerCase() === "h") { setHandMode(!handMode) }
      else if (e.key.toLowerCase() === "n") { e.preventDefault(); $("add").click() }
      else if ((e.key === "Delete" || e.key === "Backspace") && (sel || selSet.size)) { $("del").click() }
      else if (e.key === "Escape") { if (handMode) setHandMode(false); $("close").click() }
    });
    window.addEventListener("keyup", e => { if (e.code === "Space") { spaceDown = false; $("scroll").classList.remove("panning"); if (!handMode) $("scroll").classList.remove("space-ready") } });

    $("sync-btn").onclick = () => {
      const cfg = getCfg();
      $("cfg-url").value = cfg.url || "";
      $("cfg-key").value = cfg.key || "";
      $("cfg-modal").showModal();
    };
    $("cfg-cancel").onclick = () => $("cfg-modal").close();
    $("cfg-save").onclick = () => {
      const cfg = { url: $("cfg-url").value.trim(), key: $("cfg-key").value.trim() };
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      $("cfg-modal").close();
      sb = null; initCloud();
    };

    initUser(); loadLocalBoard(true); renderSubgroups(); render(); applyCam(); initCloud();
  </script>
</body>

</html>
