<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Postit Tristes</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f3efe6;
      --dot: #d6cebe;
      --bar: #f7f4ec;
      --ink: #181715;
      --mute: #655f53;
      --line: #181715;
      --panel: #fbf9f3;
      --acc: #0b8766;
      --accink: #fffdf9;
      --shd: #25221b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 600 14px/1.4 "Bricolage Grotesque", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    header {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--bar);
      border-bottom: 2px solid var(--line);
      z-index: 25
    }

    h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin: 0 6px 0 0;
      display: flex;
      align-items: center;
      gap: 7px
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    .btn {
      background: var(--acc);
      color: var(--accink);
      border: 2px solid var(--line);
      border-radius: 11px;
      padding: 7px 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 3px 3px 0 var(--shd);
      transition: transform .12s, box-shadow .12s, filter .12s
    }

    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--shd);
      filter: brightness(1.05)
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--shd)
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .chip {
      border: 2px solid var(--line);
      background: var(--panel);
      border-radius: 99px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 2px 3px 0 var(--shd);
      transition: transform .1s, box-shadow .1s, background .12s
    }

    .chip:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 4px 0 var(--shd)
    }

    .chip.on {
      background: var(--ink);
      color: #fffdf9;
      border-color: var(--ink);
      box-shadow: 2px 3px 0 #0b8766
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative
    }

    #scroll {
      flex: 1;
      overflow: hidden;
      position: relative;
      touch-action: none;
      cursor: default;
      user-select: none;
      background-image: radial-gradient(var(--dot) 1.7px, transparent 1.7px);
      background-size: 26px 26px
    }

    #scroll.space-ready {
      cursor: grab
    }

    #scroll.panning {
      cursor: grabbing
    }

    #board {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform
    }

    /* Carriles de Columnas y botón + para nueva columna */
    .col-lane {
      position: absolute;
      width: 236px;
      border-radius: 18px;
      background: rgba(24, 23, 21, .035);
      border: 2px dashed rgba(24, 23, 21, .22);
      pointer-events: none;
      transition: background .15s, border-color .15s;
      z-index: 1
    }

    .col-lane.active-col {
      background: rgba(11, 135, 102, .11);
      border-color: var(--acc);
      border-style: solid
    }

    .col-add-note {
      position: absolute;
      width: 220px;
      height: 40px;
      border-radius: 12px;
      border: 2px dashed rgba(24, 23, 21, .4);
      background: rgba(251, 249, 243, .65);
      color: var(--ink);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 4;
      transition: background .14s, transform .12s, box-shadow .14s, border-style .14s
    }

    .col-add-note:hover {
      background: var(--panel);
      border: 2px solid var(--line);
      box-shadow: 3px 4px 0 var(--shd);
      transform: translate(-1px, -2px)
    }

    .add-col-btn {
      position: absolute;
      width: 58px;
      height: 78px;
      border-radius: 15px;
      border: 2px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 4px 5px 0 var(--shd);
      transition: transform .14s cubic-bezier(.2, 1.4, .3, 1), background .15s, box-shadow .14s
    }

    .add-col-btn:hover {
      background: #e3b744;
      color: #fffdf9;
      box-shadow: 5px 7px 0 #4a3c16;
      transform: translate(-1px, -2px) scale(1.04)
    }

    .drop-slot {
      position: absolute;
      width: 220px;
      height: 7px;
      border-radius: 99px;
      background: var(--ink);
      box-shadow: 0 0 0 3px #e3b744;
      pointer-events: none;
      display: none;
      z-index: 40
    }

    /* Caja de selección múltiple */
    #marquee {
      position: absolute;
      border: 2px solid var(--ink);
      background: rgba(227, 183, 68, .22);
      border-radius: 8px;
      pointer-events: none;
      display: none;
      z-index: 30
    }

    /* Cursores en vivo */
    .peer-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 40;
      transition: transform .07s linear;
      left: 0;
      top: 0
    }

    .peer-cursor svg {
      width: 18px;
      height: 18px;
      filter: drop-shadow(2px 2px 0 #181715)
    }

    .peer-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1.5px solid #181715;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      margin-left: 10px;
      margin-top: -4px;
      white-space: nowrap;
      box-shadow: 2px 3px 0 #181715
    }

    /* Notas (Post-its) con estética Neobrutalista (bordes definidos + sombra sólida desplazada) */
    .note {
      --card-shd: #2b261d;
      --card-ink: #fffdf9;
      --card-sub: rgba(255, 253, 249, .86);
      --card-pill: rgba(0, 0, 0, .18);
      position: absolute;
      width: 220px;
      min-height: 132px;
      padding: 13px 14px;
      border-radius: 15px;
      border: 2px solid #181715;
      color: var(--card-ink);
      box-shadow: 4px 6px 0 var(--card-shd);
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: box-shadow .16s cubic-bezier(.2, 1.3, .3, 1), transform .16s cubic-bezier(.2, 1.3, .3, 1);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transform-origin: 50% 35%
    }

    .note:hover {
      box-shadow: 6px 8px 0 var(--card-shd);
      transform: translate(-1px, -2px)
    }

    .note.sel {
      outline: 3px solid #181715;
      outline-offset: 3px;
      z-index: 10
    }

    .note.grabbed {
      z-index: 45 !important;
      box-shadow: 9px 15px 0 var(--card-shd) !important;
      transform: translateY(-6px) scale(1.075) rotate(var(--tilt, 0deg)) !important;
      transition: box-shadow .14s cubic-bezier(.2, 1.4, .3, 1), transform .06s linear
    }

    .note.wobble-start {
      animation: grabWobble .32s cubic-bezier(.2, 1.5, .4, 1)
    }

    .note.landed {
      animation: landBounce .28s cubic-bezier(.25, 1.5, .5, 1)
    }

    @keyframes grabWobble {
      0% {
        transform: scale(1) rotate(0deg)
      }

      35% {
        transform: translateY(-7px) scale(1.1) rotate(-4.5deg)
      }

      70% {
        transform: translateY(-6px) scale(1.06) rotate(3deg)
      }

      100% {
        transform: translateY(-6px) scale(1.075) rotate(var(--tilt, 0deg))
      }
    }

    @keyframes landBounce {
      0% {
        transform: translateY(-4px) scale(1.06)
      }

      45% {
        transform: translateY(2px) scale(1.05, 0.93)
      }

      75% {
        transform: translateY(-1px) scale(0.98, 1.02)
      }

      100% {
        transform: translateY(0) scale(1)
      }
    }

    /* Polvito vectorial estilo Nintendo/Neobrutalista al soltar la nota */
    .dust-puff {
      position: absolute;
      pointer-events: none;
      z-index: 8;
      background: #fffdf7;
      border: 2px solid #181715;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: dustBurst .42s cubic-bezier(.15, .85, .3, 1) forwards
    }

    @keyframes dustBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(.35)
      }

      55% {
        opacity: 1;
        transform: translate(calc(-50% + var(--dx) * .75), calc(-50% + var(--dy) * .75)) scale(1.1)
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15)
      }
    }

    .q-dup {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #181715;
      color: #fffdf9;
      border: 2px solid #fffdf9;
      font-weight: 800;
      font-size: 16px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, .35);
      z-index: 15;
      padding: 0;
      transition: transform .12s
    }

    .q-dup:hover {
      transform: translateX(-50%) scale(1.16);
      background: var(--acc)
    }

    .q-dup.top {
      top: -15px
    }

    .q-dup.bot {
      bottom: -15px
    }

    .note.sel .q-dup {
      display: flex
    }

    .note b {
      display: block;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.2px;
      line-height: 1.22;
      overflow-wrap: anywhere
    }

    .note.is-title {
      min-height: 76px;
      padding: 15px 16px;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 16px
    }

    .note.is-title b {
      font-size: 20px;
      line-height: 1.18;
      margin: 0
    }

    .note-body {
      font-size: 12.5px;
      line-height: 1.36;
      color: var(--card-sub);
      white-space: pre-wrap;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
      margin: 1px 0
    }

    .note-checks {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 2px 0
    }

    .chk-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 12px;
      line-height: 1.25;
      cursor: pointer;
      padding: 3px 4px;
      border-radius: 6px
    }

    .chk-row:hover {
      background: rgba(0, 0, 0, .09)
    }

    .chk-row input {
      width: 14px;
      height: 14px;
      margin: 1px 0 0;
      cursor: pointer;
      accent-color: #181715;
      flex-shrink: 0
    }

    .chk-row.done span {
      text-decoration: line-through;
      opacity: .68
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
      padding-top: 4px;
      align-items: center
    }

    .tag {
      display: inline-block;
      background: var(--card-pill);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700
    }

    .drive-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fffdf9;
      color: #181715;
      border: 1.5px solid #181715;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 8px;
      margin-top: 3px;
      width: fit-content;
      box-shadow: 2px 2px 0 #181715;
      transition: transform .1s, box-shadow .1s
    }

    .drive-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #181715
    }

    .drive-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      margin-top: 3px;
      padding-top: 5px;
      border-top: 1.5px solid rgba(0, 0, 0, .14);
      color: var(--card-sub);
      font-weight: 700
    }

    /* Panel lateral izquierdo fijo de Subgrupos (estilo Neobrutalista con Fichas) */
    #sub-drawer {
      width: 248px;
      flex-shrink: 0;
      background: var(--bar);
      border-right: 2px solid var(--line);
      padding: 15px 14px;
      z-index: 22;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .sub-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.3px;
      color: var(--ink)
    }

    .nb-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 99px;
      background: var(--ink);
      color: #fffdf9;
      font-size: 12.5px;
      font-weight: 800
    }

    .sub-filter-btn {
      margin-left: auto;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 2px solid var(--line);
      background: #fffdf9;
      color: var(--ink);
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 3px 0 var(--shd);
      transition: transform .12s, box-shadow .12s, background .14s, color .14s
    }

    .sub-filter-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 4px 0 var(--shd)
    }

    .sub-filter-btn.on {
      background: #098967;
      color: #fffdf9;
      box-shadow: 2px 3px 0 #063b2c
    }

    .sub-filter-btn svg {
      width: 15px;
      height: 15px;
      display: block
    }

    .sub-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      overflow-y: auto;
      overflow-x: visible;
      flex: 1;
      padding: 3px 6px 10px 2px
    }

    .sub-item {
      --card-shd: #2b261d;
      --card-ink: #fffdf9;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 13px;
      border-radius: 14px;
      cursor: grab;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--card-ink);
      border: 2px solid #181715;
      box-shadow: 4px 5px 0 var(--card-shd);
      user-select: none;
      touch-action: none;
      transition: transform .15s cubic-bezier(.2, 1.3, .3, 1), box-shadow .15s cubic-bezier(.2, 1.3, .3, 1)
    }

    .sub-item:hover {
      transform: translate(-1px, -2px);
      box-shadow: 5px 7px 0 var(--card-shd)
    }

    .sub-item.active {
      outline: 2.5px solid #181715;
      outline-offset: 2px;
      transform: translate(-1px, -1px);
      box-shadow: 5px 7px 0 var(--card-shd)
    }

    .sub-item.grabbed {
      z-index: 50 !important;
      cursor: grabbing;
      box-shadow: 8px 13px 0 var(--card-shd) !important;
      transform: translateY(-4px) scale(1.04) rotate(var(--stilt, 0deg)) !important;
      transition: box-shadow .12s, transform .05s linear
    }

    .sub-item.landed {
      animation: landBounce .26s cubic-bezier(.25, 1.5, .5, 1)
    }

    .sub-item .sub-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.2
    }

    .sub-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: .85;
      transition: transform .12s, background .12s
    }

    .sub-item.active .sub-ring::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor
    }

    .sub-item .sub-act {
      background: rgba(0, 0, 0, .16);
      border: 1.5px solid rgba(0, 0, 0, .25);
      width: 26px;
      height: 26px;
      padding: 0;
      cursor: pointer;
      border-radius: 50%;
      font-size: 12.5px;
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform .12s, background .12s
    }

    .sub-item .sub-act:hover {
      transform: scale(1.12);
      background: #181715;
      color: #fffdf9;
      border-color: #181715
    }

    .sub-drop-line {
      height: 5px;
      border-radius: 99px;
      background: #181715;
      box-shadow: 0 0 0 2px #e3b744;
      margin: -3px 2px;
      pointer-events: none
    }

    /* Menú flotante chiquito para editar Subgrupo (Nombre + Color) */
    #sub-pop {
      position: fixed;
      left: 262px;
      top: 110px;
      width: 256px;
      background: var(--panel);
      border: 2px solid #181715;
      border-radius: 15px;
      box-shadow: 5px 7px 0 var(--shd);
      padding: 11px 13px 13px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 70
    }

    #sub-pop.open {
      display: flex
    }

    #sub-pop.pop-anim {
      animation: panelPop .24s cubic-bezier(.2, 1.45, .35, 1)
    }

    /* Menú flotante tipo tarjeta (con Pop y arrastrable como un post-it) */
    aside {
      position: fixed;
      left: 50%;
      top: 90px;
      width: 320px;
      max-height: calc(100vh - 80px);
      background: var(--panel);
      border: 2px solid #181715;
      border-radius: 16px;
      box-shadow: 6px 8px 0 var(--shd);
      padding: 12px 14px 14px;
      overflow: auto;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 65;
      cursor: grab;
      touch-action: none;
      transform-origin: center top
    }

    aside.open {
      display: flex
    }

    aside.pop-anim {
      animation: panelPop .26s cubic-bezier(.2, 1.45, .35, 1)
    }

    aside.dragging-panel {
      cursor: grabbing;
      box-shadow: 10px 16px 0 var(--shd);
      transform: scale(1.03) rotate(var(--ptilt, 0deg))
    }

    @keyframes panelPop {
      0% {
        opacity: 0;
        transform: scale(.74) translateY(8px)
      }

      65% {
        opacity: 1;
        transform: scale(1.04) translateY(-2px)
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    .panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 2px dashed rgba(24, 23, 21, .2);
      user-select: none
    }

    .panel-grip {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px
    }

    .panel-x {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font-weight: 800;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      box-shadow: 2px 2px 0 var(--shd);
      transition: transform .12s, background .12s
    }

    .panel-x:hover {
      background: #fa6e61;
      color: #fff;
      transform: scale(1.1)
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink)
    }

    input,
    select,
    textarea {
      background: #fffdf9;
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 7px 10px;
      color: var(--ink);
      font-weight: 600;
      width: 100%;
      box-shadow: 2px 2px 0 rgba(24, 23, 21, .12)
    }

    textarea {
      min-height: 72px;
      resize: vertical
    }

    .sw {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .sw button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #181715;
      box-shadow: 2px 2px 0 #181715;

  <script>

    const DRIVE_SVG = `<svg viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>`;

    const COLORS = ["#e3b744", "#098967", "#fa6e61", "#4b7bec", "#9b6be8", "#f39237", "#e6decb"];
    const LEGACY_COLOR_MAP = {
      "#ffd966": "#e3b744",
      "#ff9f80": "#fa6e61",
      "#8fd9b6": "#098967",
      "#7cc4f5": "#4b7bec",
      "#c9a6f5": "#9b6be8",
      "#f5a6cf": "#f39237",
      "#e9e9e4": "#e6decb"
    };
    const CARD_THEMES = {
      "#e3b744": { shd: "#574518", ink: "#fffdf9", sub: "rgba(255,253,249,.88)", pill: "rgba(0,0,0,.18)" },
      "#098967": { shd: "#063b2c", ink: "#fffdf9", sub: "rgba(255,253,249,.88)", pill: "rgba(0,0,0,.22)" },
      "#fa6e61": { shd: "#5c211b", ink: "#fffdf9", sub: "rgba(255,253,249,.9)", pill: "rgba(0,0,0,.2)" },
      "#4b7bec": { shd: "#1b3166", ink: "#fffdf9", sub: "rgba(255,253,249,.88)", pill: "rgba(0,0,0,.22)" },
      "#9b6be8": { shd: "#3a2263", ink: "#fffdf9", sub: "rgba(255,253,249,.88)", pill: "rgba(0,0,0,.22)" },
      "#f39237": { shd: "#5e330c", ink: "#fffdf9", sub: "rgba(255,253,249,.88)", pill: "rgba(0,0,0,.2)" },
      "#e6decb": { shd: "#4a4335", ink: "#181715", sub: "rgba(24,23,21,.76)", pill: "rgba(24,23,21,.12)" }
    };
    function normalizeColor(c) {
      if (!c) return COLORS[0];
      const low = c.toLowerCase();
      return LEGACY_COLOR_MAP[low] || c;
    }
    function applyCardTheme(el, rawColor) {
      const c = normalizeColor(rawColor);
      const th = CARD_THEMES[c.toLowerCase()] || { shd: "#25221b", ink: "#fffdf9", sub: "rgba(255,253,249,.86)", pill: "rgba(0,0,0,.18)" };
      el.style.background = c;
      el.style.setProperty("--card-shd", th.shd);
      el.style.setProperty("--card-ink", th.ink);
      el.style.setProperty("--card-sub", th.sub);
      el.style.setProperty("--card-pill", th.pill);
      return c;
    }
    const PEER_COLORS = ["#e03131", "#1971c2", "#2f9e44", "#9c36b5", "#f08c00", "#0c8599"];
    const KEY = "tablero-assets-v2", CFG_KEY = "tablero-assets-cfg-v1", USER_KEY = "tablero-user-v1";

    let subgroups = [
      { id: "principal", name: "📋 General", color: COLORS[0] },
      { id: "mecanicas", name: "⚙️ Mecánicas", color: COLORS[1] },
      { id: "arte", name: "🎨 Assets de Arte", color: COLORS[2] },
      { id: "audio", name: "🎵 Audio y SFX", color: COLORS[3] }
    ];
    let catColors = {
      "Torres": COLORS[0],
      "Habilidades": COLORS[1],
      "UI": COLORS[2]
    };
    let subCols = {}; // Número de columnas por subgrupo (por defecto 5)
    let allNotesWho = {}; // Mapa global idNota -> nombre de responsable (de todos los subgrupos)
    let allNotesMeta = {}; // Mapa global idNota -> { board, who, st } para filtrar subgrupos por tareas asignadas
    let subFilterMine = false; // Filtro del panel de subgrupos: solo subgrupos con tareas asignadas al usuario activo
    let collabs = []; // Lista global de nombres de colaboradores
    let avatars = {}; // Mapa nombreColaborador -> dataURL de su imagen de avatar
    let workSecs = {}; // Mapa nombreColaborador -> segundos totales trabajados
    let timerRunning = false, timerLastTick = 0, timerInterval = null, timerSyncTicks = 0;
    let curUser = ""; // Colaborador activo seleccionado en este navegador
    let curSub = "principal";
    let S = { notes: [], filter: "Todos" }, sel = null, selSet = new Set(), sb = null, channel = null, saveTimers = {}, pendingRows = {}, qStr = "";
    let undoStack = [], cloudReqId = 0;
    let cam = { x: 0, y: 0, z: 1 }, camAnim = null, spaceDown = false;
    let myId = "u_" + Math.random().toString(36).slice(2, 9), myColor = PEER_COLORS[Math.floor(Math.random() * PEER_COLORS.length)];
    let myDevId = "";
    try { myDevId = localStorage.getItem("tablero-dev-id") || ""; if (!myDevId) { myDevId = "d_" + Math.random().toString(36).slice(2, 10); localStorage.setItem("tablero-dev-id", myDevId) } } catch (e) { myDevId = myId }
    let peers = {}, activePeers = {}, presenceInterval = null, initialSubPicked = false, lastCursorSent = 0;
    const MIN_Z = 0.25, MAX_Z = 2.5, NOTE_W = 220, NOTE_H = 136;
    const COL_X0 = 32, COL_Y0 = 26, COL_STEP = 252, DEFAULT_COLS = 5;
    const $ = id => document.getElementById(id);

    function colX(c) { return COL_X0 + c * COL_STEP }
    function xToCol(x, maxCols) {
      const mc = maxCols || getNumCols();
      return Math.max(0, Math.min(mc - 1, Math.round(((x || 0) - COL_X0) / COL_STEP)));
    }
    function defaultTitleId(subId, c) {
      let h = 2166136261;
      for (let i = 0; i < subId.length; i++) h = Math.imul(h ^ subId.charCodeAt(i), 16777619);
      return (Math.abs(h) % 80000000) * 100 + c + 1;
    }
    function getNumCols() {
      const base = Number(subCols[curSub]) || DEFAULT_COLS;
      subCols[curSub] = Math.max(1, Math.min(25, base));
      return subCols[curSub];
    }
    function ensureColumnTitles(pushNew = false) {
      const numCols = getNumCols();
      const titlesByCol = new Map();
      const extraTitles = [];
      S.notes.filter(n => n.st === "titulo").forEach(n => {
        const c = xToCol(n.x, numCols);
        if (!titlesByCol.has(c)) {
          n.x = colX(c);
          n.y = COL_Y0;
          titlesByCol.set(c, n);
        } else {
          extraTitles.push(n);
        }
      });
      for (let c = 0; c < numCols; c++) {
        if (!titlesByCol.has(c)) {
          const reused = extraTitles.shift();
          if (reused) {
            reused.x = colX(c);
            reused.y = COL_Y0;
            titlesByCol.set(c, reused);
            if (pushNew) pushNote(reused, 20);
          } else {
            const tn = {
              id: defaultTitleId(curSub, c),
              t: "Columna " + (c + 1),
              cat: "",
              who: "",
              st: "titulo",
              link: "",
              body: "",
              color: COLORS[c % COLORS.length],
              x: colX(c),
              y: COL_Y0
            };
            S.notes.push(tn);
            titlesByCol.set(c, tn);
            if (pushNew) pushNote(tn, 20);
          }
        }
      }
    }

    function cloneNotes(arr) { return JSON.parse(JSON.stringify(arr || [])) }
    function recordUndo() {
      undoStack.push(cloneNotes(S.notes));
      if (undoStack.length > 45) undoStack.shift();
    }
    function undo() {
      if (!undoStack.length) return;
      const prev = undoStack.pop();
      const prevMap = new Map(prev.map(n => [n.id, n]));
      const curMap = new Map(S.notes.map(n => [n.id, n]));
      // Notas que se crearon después del snapshot -> borrarlas de la nube
      const toDelete = [];
      curMap.forEach((_, id) => { if (!prevMap.has(id)) toDelete.push(id) });
      // Notas que se borraron o modificaron -> restaurarlas en la nube
      const toUpsert = [];
      prevMap.forEach((pn, id) => {
        const cn = curMap.get(id);
        if (!cn || JSON.stringify(cn) !== JSON.stringify(pn)) toUpsert.push(pn);
      });
      S.notes = prev;
      save();
      if (toDelete.length) deleteNotesRemote(toDelete);
      toUpsert.forEach(n => pushNote(n, 0));
      if (sel && !S.notes.some(n => n.id === sel)) { sel = null; selSet.clear(); $("panel").classList.remove("open") }
      render();
      if (sel) syncPanelFromNote(cur());
    }

    function getCatColor(cat, fallback) {
      const k = (cat || "").trim();
      if (!k) return normalizeColor(fallback || COLORS[0]);
      if (!catColors[k]) {
        const used = Object.keys(catColors).length;
        catColors[k] = normalizeColor(fallback || COLORS[used % COLORS.length]);
      } else {
        catColors[k] = normalizeColor(catColors[k]);
      }
      return catColors[k];
    }

    // --- Colaboradores, Avatares y Selector de Usuario Activo ---
    let avatarTargetCallback = null;
    let editingUserOrigName = null;
    let upopTempAvatar = "";

    function fillAvatarEl(el, name, fallbackIcon = "👤") {
      if (!el) return;
      const n = (name || "").trim();
      const av = n ? avatars[n] : "";
      if (av) {
        el.innerHTML = `<img src="${av}" alt="${n.replace(/"/g, "&quot;")}">`;
      } else if (n) {
        el.textContent = n[0].toUpperCase();
      } else {
        el.textContent = fallbackIcon;
      }
    }

    function ensureCollab(name) {
      const n = (name || "").trim();
      if (!n) return;
      if (!collabs.includes(n)) collabs.push(n);
    }

    function getAllWhos() {
      // La lista oficial de colaboradores es `collabs` (gestionada con + y 🗑).
      // Solo si está completamente vacía, se inicializa con los responsables encontrados en notas.
      if (!collabs.length) {
        const set = new Set();
        Object.values(allNotesWho).forEach(w => { if (w) set.add(w) });
        S.notes.forEach(n => { const w = (n.who || "").trim(); if (w) set.add(w) });
        if (curUser) set.add(curUser);
        collabs = [...set];
      }
      return collabs;
    }

    function fmtHMS(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      return [h, m, r].map(v => String(v).padStart(2, "0")).join(":");
    }

    function fmtHumanTime(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      return `${h}h ${String(m).padStart(2, "0")}m ${String(r).padStart(2, "0")}s`;

      timerInterval = setInterval(() => {
        if (!timerRunning || !curUser) return;

        const delta = Math.max(1, Math.round((now - timerLastTick) / 1000));
        timerLastTick = now;
        workSecs[curUser] = (workSecs[curUser] || 0) + delta;
        renderTimerUI();
        if ($("rank-pop").classList.contains("open")) renderRankingPop();
        timerSyncTicks++;

    function resizeImageToAvatar(file, cb) {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const sz = 96;
          const cv = document.createElement("canvas");
          cv.width = sz;
          cv.height = sz;
          const ctx = cv.getContext("2d");
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, sz, sz);
          cb(cv.toDataURL("image/jpeg", 0.84));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- Cámara (Pan, Zoom y Animación Suave) ---
    function applyCam() {
      const sc = $("scroll"), b = $("board");
      b.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
      const gs = 26 * cam.z;
      sc.style.backgroundSize = `${gs}px ${gs}px`;
      sc.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
      $("z-rst").textContent = Math.round(cam.z * 100) + "%";
    }
    function animateCamTo(tx, ty, tz, dur = 320) {
      if (camAnim) cancelAnimationFrame(camAnim);
      const sx = cam.x, sy = cam.y, sz = cam.z, t0 = performance.now();
      function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
        cam.x = sx + (tx - sx) * e;
        cam.y = sy + (ty - sy) * e;
        cam.z = sz + (tz - sz) * e;
        applyCam();
        if (p < 1) camAnim = requestAnimationFrame(step);
        else camAnim = null;
      }
      camAnim = requestAnimationFrame(step);
    }
    function zoomAt(newZ, cx, cy) {
      if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null }
      const sc = $("scroll"), rect = sc.getBoundingClientRect();
      const px = cx !== undefined ? cx - rect.left : rect.width / 2;
      const py = cy !== undefined ? cy - rect.top : rect.height / 2;
      const clamped = Math.min(MAX_Z, Math.max(MIN_Z, newZ));
      const wx = (px - cam.x) / cam.z, wy = (py - cam.y) / cam.z;
      cam.z = clamped;
      cam.x = px - wx * cam.z;
      cam.y = py - wy * cam.z;
      applyCam();
    }
    function focusNoteSmooth(n) {
      const sc = $("scroll"), rect = sc.getBoundingClientRect();
      const targetZ = Math.max(cam.z, 1.08);
      const availW = rect.width - (window.innerWidth > 700 ? 325 : 0);
      const tx = availW / 2 - (n.x + NOTE_W / 2) * targetZ;
      const ty = rect.height / 2 - (n.y + NOTE_H / 2) * targetZ;
      animateCamTo(tx, ty, targetZ, 340);
    }
    function fitAll() {
      const vis = visibleNotes();
      if (!vis.length) { animateCamTo(0, 0, 1, 280); return }
      const sc = $("scroll"), rect = sc.getBoundingClientRect();
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      vis.forEach(n => {
        minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + NOTE_W); maxY = Math.max(maxY, n.y + NOTE_H);
      });
      const bw = maxX - minX, bh = maxY - minY, pad = 90;
      const zx = (rect.width - pad * 2) / Math.max(bw, 1), zy = (rect.height - pad * 2) / Math.max(bh, 1);
      const tz = Math.min(1.15, Math.max(MIN_Z, Math.min(zx, zy)));
      const tx = rect.width / 2 - (minX + bw / 2) * tz;
      const ty = rect.height / 2 - (minY + bh / 2) * tz;
      animateCamTo(tx, ty, tz, 320);
    }

    // --- Parseo de Checklists y Texto dentro de n.body ---
    function parseBody(raw) {
      const lines = (raw || "").split("\n");
      const checks = [], textLines = [];
      lines.forEach(l => {
        const m = l.match(/^\s*[-*]?\s*\[( |x|X)\]\s*(.*)$/);
        if (m) checks.push({ done: m[1].toLowerCase() === "x", text: m[2] });
        else textLines.push(l);
      });
      return { checks, text: textLines.join("\n").replace(/^\n+|\n+$/g, "") };
    }
    function serializeBody(checks, text) {
      const cPart = checks.map(c => `[${c.done ? "x" : " "}] ${c.text}`).join("\n");
      const tPart = (text || "").trim();
      if (cPart && tPart) return cPart + "\n" + tPart;
      return cPart || tPart;
    }

    function subgroupHasUserTasks(subId, userName) {
      const target = (userName || "").trim();
      if (!target) return false;
      if (subId === curSub) {

      }
      const metaEntries = Object.values(allNotesMeta).filter(m => m && m.board === subId);
      if (metaEntries.length) {
        return metaEntries.some(m => m.st !== "titulo" && m.who === target);
      }
      try {
        const raw = localStorage.getItem(KEY + "-" + subId);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.notes)) {

      if (!listToShow.length) {

        empty.style.cssText = "font-size:12.5px;font-weight:700;color:var(--mute);text-align:center;padding:18px 8px;border:2px dashed rgba(24,23,21,.22);border-radius:12px";
        empty.textContent = `No tienes tareas asignadas como "${curUser}".`;
        w.appendChild(empty);
        return;
      }

      listToShow.forEach((sg) => {
        const idx = subgroups.indexOf(sg);
        if (!sg.color) sg.color = COLORS[idx % COLORS.length];
        else sg.color = normalizeColor(sg.color);

        const d = document.createElement("div");
        d.className = "sub-item" + (sg.id === curSub ? " active" : "") + (sg.id === landedId ? " landed" : "");
        d.dataset.sub = sg.id;
        applyCardTheme(d, sg.color);

        const sp = document.createElement("span");
        sp.className = "sub-name";
        sp.textContent = sg.name;
        d.appendChild(sp);

        const peersBox = document.createElement("div");
        peersBox.className = "sub-peers";
        peersBox.dataset.subPeers = sg.id;
        d.appendChild(peersBox);

        const editB = document.createElement("button");
        editB.type = "button";
        editB.className = "sub-act";
        editB.textContent = "✎";
        editB.title = "Editar nombre y color";
        editB.onpointerdown = e => e.stopPropagation();
        editB.onclick = e => {
          e.stopPropagation();
          playSfx("pickup");
          openSubEditPop(sg, d);
        };
        d.appendChild(editB);

        const ring = document.createElement("span");
        ring.className = "sub-ring";
        ring.title = sg.id === curSub ? "Subgrupo activo" : "Ir a este subgrupo";
        d.appendChild(ring);

        // Clic derecho en la ficha también abre el mini-panel de edición
        d.addEventListener("contextmenu", e => {
          e.preventDefault();
          playSfx("pickup");
          openSubEditPop(sg, d);
        });

        // Arrastre táctil con físicas (igual que los post-its) para reacomodar fichas
        d.addEventListener("pointerdown", e => {
          if (e.button !== 0 || e.target.closest(".sub-act")) return;
          const sy = e.clientY;
          let moved = false, lastY = e.clientY, tilt = 0, dropDest = idx;
          let lineEl = null;
          d.setPointerCapture(e.pointerId);

          const mv = ev => {
            const dy = ev.clientY - sy;
            if (!moved && Math.abs(dy) > 5) {
              moved = true;
              closeSubEditPop();
              d.classList.add("grabbed");
              playSfx("pickup");
              lineEl = document.createElement("div");
              lineEl.className = "sub-drop-line";
            }
            if (!moved) return;

            const vy = ev.clientY - lastY;
            lastY = ev.clientY;
            tilt = tilt * 0.6 + Math.max(-5, Math.min(5, vy * 0.32)) * 0.4;
            d.style.setProperty("--stilt", tilt.toFixed(2) + "deg");
            d.style.transform = `translateY(${dy}px) scale(1.04) rotate(${tilt.toFixed(2)}deg)`;

            // Calcular posición destino entre las fichas
            const cards = [...w.querySelectorAll(".sub-item")];
            dropDest = subgroups.length;
            let insertBeforeEl = null;
            for (let i = 0; i < cards.length; i++) {
              const cEl = cards[i];
              const cr = cEl.getBoundingClientRect();
              if (ev.clientY < cr.top + cr.height / 2) {
                dropDest = i;
                insertBeforeEl = cEl;
                break;
              }
            }
            if (lineEl) {
              if (insertBeforeEl) w.insertBefore(lineEl, insertBeforeEl);
              else w.appendChild(lineEl);
            }
          };

          const up = () => {
            d.removeEventListener("pointermove", mv);
            d.removeEventListener("pointerup", up);
            if (lineEl) lineEl.remove();
            if (moved) {
              d.classList.remove("grabbed");
              d.style.transform = "";
              d.style.setProperty("--stilt", "0deg");
              playSfx("drop");
              const [movedSg] = subgroups.splice(idx, 1);
              const finalIdx = dropDest > idx ? dropDest - 1 : dropDest;
              subgroups.splice(Math.max(0, Math.min(subgroups.length, finalIdx)), 0, movedSg);
              saveSubgroupsRemote();
              renderSubgroups(sg.id);
            } else {
              if (curSub !== sg.id) playSfx("pickup");
              switchSubgroup(sg.id);
            }
          };

          d.addEventListener("pointermove", mv);
          d.addEventListener("pointerup", up);
        });

        w.appendChild(d);
      });
      updateOnlinePeersUI();
    }
    function unpackMeta(raw, persistLocal = false) {
      try {
        const p = JSON.parse(raw);
        if (Array.isArray(p)) { subgroups = p }
        else if (p && typeof p === "object") {
          if (Array.isArray(p.subs) && p.subs.length) subgroups = p.subs;
          if (p.catColors && typeof p.catColors === "object") catColors = { ...catColors, ...p.catColors };
          if (p.subCols && typeof p.subCols === "object") subCols = { ...p.subCols };
          if (Array.isArray(p.collabs)) {
            collabs = [...new Set(p.collabs.map(c => (c || "").trim()).filter(Boolean))];
            // Si el usuario activo fue eliminado remotamente, cambiar al primero disponible
            if (curUser && collabs.length && !collabs.includes(curUser)) {
              curUser = collabs[0];
              try { localStorage.setItem(USER_KEY, curUser) } catch (e) { }
            }
          }
          if (p.avatars && typeof p.avatars === "object") avatars = { ...p.avatars };
          if (p.workSecs && typeof p.workSecs === "object") {
            const nextWork = {};
            Object.keys(p.workSecs).forEach(k => {
              nextWork[k] = Math.max(workSecs[k] || 0, Number(p.workSecs[k]) || 0);
            });
            workSecs = nextWork;
          }
        }
        subgroups.forEach((sg, i) => { sg.color = normalizeColor(sg.color || COLORS[i % COLORS.length]) });
        Object.keys(catColors).forEach(k => { catColors[k] = normalizeColor(catColors[k]) });
        if (persistLocal) {
          try { localStorage.setItem(KEY + "-subs", JSON.stringify({ subs: subgroups, catColors, subCols, collabs, avatars, workSecs })) } catch (e) { }
        }
      } catch (e) { }
    }
    async function saveSubgroupsRemote() {
      const payload = { subs: subgroups, catColors, subCols, collabs, avatars, workSecs };
      try { localStorage.setItem(KEY + "-subs", JSON.stringify(payload)) } catch (e) { }
      if (!sb) return;
      await sb.from("notes").upsert({
        id: META_ID, board: META_BOARD, t: "__subgrupos__", cat: "", who: "", st: "", link: "",
        body: JSON.stringify(payload), color: "#e3b744", x: 0, y: 0, updated_at: new Date().toISOString()
      });
    }
    function clearPeerCursors() {
      Object.values(peers).forEach(p => { clearTimeout(p.timer); p.el.remove() });
      peers = {};
    }
    function flushPendingSaves() {
      Object.keys(saveTimers).forEach(id => {
        clearTimeout(saveTimers[id]);
        delete saveTimers[id];
      });
      const rows = Object.values(pendingRows);
      pendingRows = {};
      if (sb && rows.length) {
        sb.from("notes").upsert(rows).then(({ error }) => { if (error) setStatus("err", "Error al guardar en nube") });
      }
    }
    function sendPresencePing(isLeave = false) {
      if (!channel) return;
      channel.send({
        type: "broadcast",
        event: "presence_ping",
        payload: {
          id: myId,
          devId: myDevId,
          name: curUser || "Invitado/a",
          sub: curSub,
          color: myColor,
          working: timerRunning,
          secs: curUser ? (workSecs[curUser] || 0) : 0,
          leave: isLeave
        }
      });
    }
    window.addEventListener("beforeunload", () => {
      if (timerRunning) saveSubgroupsRemote();
      sendPresencePing(true);
    });

    function updateOnlinePeersUI() {
      const topBox = $("online-peers");
      if (topBox) {
        topBox.textContent = "";
        Object.values(activePeers).forEach(p => {
          const sgObj = subgroups.find(s => s.id === p.sub);
          const sgName = sgObj ? sgObj.name : p.sub;
          const b = document.createElement("button");
          b.type = "button";
          b.className = "peer-av";
          b.style.background = p.color || "#098967";
          b.title = `🟢 ${p.name} · en ${sgName} (Clic para ir)`;
          const inner = document.createElement("span");
          inner.className = "peer-av-inner";
          fillAvatarEl(inner, p.name, "👤");
          const dot = document.createElement("span");
          dot.className = "peer-online-dot";
          b.append(inner, dot);
          b.onclick = () => {
            if (p.sub && p.sub !== curSub) {
              playSfx("pickup");
              switchSubgroup(p.sub);
            }
          };
          topBox.appendChild(b);
        });
      }
      document.querySelectorAll(".sub-peers").forEach(box => {

        Object.values(activePeers).filter(p => p.sub === subId).forEach(p => {

          av.title = `🟢 ${p.name} está aquí`;
          fillAvatarEl(av, p.name, "👤");
          box.appendChild(av);
        });
